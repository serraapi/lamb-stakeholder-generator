  <rect x="2" y="2" width="45" height="32" rx="11" fill="url(#taronja)"/>
  <path d="M9 31 L4 43 L21 33 Z" fill="#cd6646"/>
  <rect x="8.9" y="11.2" width="8.2" height="11.6" rx="4.1" fill="#fff"/>
  <circle cx="24.5" cy="17" r="4.1" fill="#fff"/>
  <rect x="31.9" y="11.2" width="8.2" height="11.6" rx="4.1" fill="#fff"/>
