<style>
  :root {
    --bg: #181816;
    --card-bg: #21211e;
    --input-bg: #2b2b27;
    --border: #3b3a35;
    --border-focus: #7a786f;
    --text-primary: #ececec;
    --text-secondary: #9e9c94;
    --accent: #d97757;
    --accent-hover: #e58869;
    --btn-secondary: #32322d;
    --btn-secondary-hover: #3d3d37;
    --pre-bg: #121210;
    --pre-text: #a8c49e;
    --radius: 12px;
    --radius-sm: 8px;
    --success: #a8c49e;
    --error: #e58869;
    /* Color del mode aleatori (complementari del taronja) */
    --random: #4a9ea3;
    --random-glow: rgba(74, 158, 163, 0.35);
  }

  html { color-scheme: dark; }
  html:has(body.light-theme) { color-scheme: light; }
  body.light-theme {
    color-scheme: light;
    --bg: #f6f5f0;
    --card-bg: #ffffff;
    --input-bg: #eeece4;
    --border: #dcd9cd;
    --border-focus: #8e8b80;
    --text-primary: #191816;
    --text-secondary: #6e6b62;
    --accent: #d97757;
    --accent-hover: #c46344;
    --btn-secondary: #e6e3d8;
    --btn-secondary-hover: #dcd8cb;
    --pre-bg: #eeece4;
    --pre-text: #2f6832;
    --random: #2f8a90;
    --random-glow: rgba(47, 138, 144, 0.3);
  }

  * { box-sizing: border-box; }

  html { overflow-x: clip; }
  body {
    overflow-x: clip;
    margin: 0;
    background-color: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .wrap { width: 100%; max-width: 1240px; }

  /* v0.6: espai de treball en dues columnes (editor per pestanyes + fitxa fixa) */
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  .editor { min-width: 0; }
  .tabs {
    display: flex; gap: 2px; padding: 4px 12px 0;
    box-shadow: inset 0 -1px 0 var(--border);
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 10px 16px; font: inherit; font-size: 0.9rem; font-weight: 500;
    color: var(--text-secondary); cursor: pointer; white-space: nowrap;
  }
  .tab:hover { color: var(--text-primary); }
  .tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--border-focus); outline-offset: -2px; }
  .card.panels { padding: 0; }
  .panels-body { padding: 22px 24px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .sub-title { font-size: 0.95rem; font-weight: 600; margin: 0; }
  /* Pestanya Reunió: cada bloc amb el títol a l'esquerra i el seu interruptor a la dreta */
  .bloc-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .bloc-title { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
  .bloc-ctrl { margin: 0; }
  /* v0.6.1: totes les pestanyes es fan amb el mateix bloc (títol a l'esquerra, control a la dreta) */
  .panel > .bloc + .bloc, #meetingBox > .bloc, #evalCodeBox .bloc { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
  .bloc-head-start { justify-content: flex-start; gap: 8px; }
  .bloc-head .btn-sm { padding: 5px 12px; }
  .bloc-head label.bloc-title, .bloc-head h3.bloc-title { margin: 0; }
  .bloc .counter { font-weight: 400; }
  .bloc textarea::placeholder, .bloc input::placeholder { color: var(--text-secondary); opacity: 0.75; }
  .fitxa-fila .v.falta { color: var(--error); font-weight: 400; font-style: italic; }
  .tab-nav { margin-left: auto; display: flex; align-items: center; gap: 4px; padding-left: 12px; }
  .tab-arrow {
    width: 30px; height: 30px; padding: 0; border-radius: 8px; border: 1px solid var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    background: none; color: var(--text-primary); cursor: pointer;
  }
  .tab-arrow:hover:not(:disabled) { border-color: var(--border-focus); }
  .tab-arrow:disabled { opacity: 0.35; cursor: default; }
  .tab-arrow:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }
  @keyframes sacseig {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-5px); } 30% { transform: translateX(5px); }
    45% { transform: translateX(-3px); } 60% { transform: translateX(3px); } 75% { transform: translateX(-1px); }
  }
  @keyframes resplendor { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 30% { box-shadow: 0 0 0 4px var(--random-glow); } }
  .switch-row.sacseig { animation: sacseig 0.6s ease; }
  .switch-row.sacseig .track { animation: resplendor 1.2s ease; border-radius: 999px; }
  @media (prefers-reduced-motion: reduce) { .switch-row.sacseig { animation: none; } }
  @media (max-width: 600px) { .tab-nav { display: none; } }
  #evalCode { max-width: 260px; }
  .field-note.avis { color: var(--error); }
  .bloc .lang-checkbox-group { margin: 0; }
  .bloc .meeting-nums { margin-top: 0; }
  .toolbar-modes { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  #tab-comportament #dynamicPanel .dynamic-banner { margin: 0 0 16px; }
  #tab-projecte #infoOberta { min-height: 120px; }
  #tab-projecte #infoOculta { min-height: 240px; }
  .panel .dyn-identity { border-bottom: none; padding-bottom: 0; }
  .panel .card-title-row { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }

  .fitxa { position: sticky; top: 16px; }
  .fitxa-card { max-height: calc(100vh - 32px); overflow-y: auto; margin-bottom: 0; }
  .fitxa-card { padding: 18px 18px 16px; }
  .fitxa-title { font-size: 0.95rem; font-weight: 600; margin: 0 0 6px; }
  .fitxa-grup { padding: 10px 0 8px; border-top: 1px solid var(--border); }
  .fitxa-grup:first-child { border-top: none; padding-top: 4px; }
  .fitxa-grup h3 { font-size: 0.76rem; font-weight: 600; color: var(--text-secondary); margin: 0 0 4px; }
  .fitxa-fila {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    width: calc(100% + 12px); margin: 0 -6px; padding: 4px 6px; border: none; border-radius: 6px;
    background: none; color: var(--text-primary); font: inherit; font-size: 0.84rem; text-align: left; cursor: pointer;
  }
  .fitxa-fila:hover { background-color: var(--pre-bg); }
  .fitxa-fila:focus-visible { outline: 2px solid var(--border-focus); }
  .fitxa-fila .k { color: var(--text-secondary); flex: none; }
  .fitxa-fila .v { text-align: right; font-weight: 500; overflow-wrap: anywhere; }
  .fitxa-fila .v.random { color: var(--random); }
  .fitxa-fila .v.buit { color: var(--text-secondary); font-weight: 400; font-style: italic; }
  .fitxa-fila .v.editat::after { content: " ✎"; color: var(--text-secondary); font-weight: 400; }
  .fitxa-export { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--border); }
  .fitxa-export label.field { margin: 0 0 -4px; }
  .trait-row.destacat { animation: destacat 1.2s ease; }
  @keyframes destacat { 0%, 40% { background-color: var(--random-glow); } 100% { background-color: transparent; } }

  .modal.modal-wide { max-width: 1000px; width: 100%; }
  #visorOverlay .prompt-viewer-box { margin: 0; }
  #visorOverlay #ui_lbl_viewer_title { visibility: hidden; }
  #visorOverlay #previewJson { margin: 0; }

  @media (max-width: 980px) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
    .fitxa { position: static; }
    .fitxa-card { max-height: none; }
    .panels-body { padding: 18px 16px; }
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }

  h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 6px 0; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-secondary); font-size: 0.88rem; margin: 0; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { width: 56px; height: 56px; flex: none; }

  .badge {
    background-color: var(--accent);
    color: #fff;
    font-size: 0.7rem;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    vertical-align: middle;
    margin-left: 6px;
  }

  .header-controls { display: flex; align-items: center; gap: 8px; }

  .theme-btn {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    padding: 0;
    cursor: pointer;
    width: 31px;
    height: 31px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .theme-btn svg { width: 16px; height: 16px; display: block; }
  .theme-btn .icon-moon { display: none; }
  body.light-theme .theme-btn .icon-sun { display: none; }
  body.light-theme .theme-btn .icon-moon { display: block; }
  .theme-btn:hover { background-color: var(--btn-secondary); border-color: var(--border-focus); }

  .lang-selector {
    display: flex;
    gap: 4px;
    background-color: var(--card-bg);
    padding: 3px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .lang-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 4px;
    cursor: pointer;
  }
  .lang-btn.active { background-color: var(--btn-secondary); color: var(--text-primary); }
  .lang-btn:hover:not(.active) { color: var(--text-primary); }

  .top-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin: 0 0 16px 0;
  }

  label.field {
    display: block;
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin: 14px 0 6px;
  }
  label.field:first-of-type { margin-top: 0; }

  .meeting-box { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .meeting-nums { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
  .meeting-nums label.field { display: flex; flex-direction: column; gap: 6px; margin: 0; }
  .meeting-nums input { width: 90px; }
  .meeting-nums.disabled { opacity: 0.45; }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    background-color: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 0.88rem;
    font-family: inherit;
  }
  input[type="text"]:focus, input[type="number"]:focus, textarea:focus { outline: none; border-color: var(--border-focus); }
  textarea { resize: vertical; min-height: 70px; line-height: 1.4; }

  .input-with-button { display: flex; gap: 8px; }
  .input-with-button input { flex: 1; }

  .lang-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 0 6px;
  }
  .lang-header-row label { margin: 0; }
  .lang-default-note { font-size: 0.75rem; color: var(--text-secondary); font-style: italic; }

  .lang-checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .lang-checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    background-color: var(--input-bg);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.85rem;
    user-select: none;
    color: var(--text-primary);
  }
  .lang-checkbox-label:hover { border-color: var(--border-focus); }
  .lang-checkbox-label input { accent-color: var(--accent); cursor: pointer; width: 15px; height: 15px; margin: 0; }

  /* --- Commutadors --- */
  .switch-row { display: flex; align-items: center; gap: 8px; }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--text-primary);
    user-select: none;
  }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: relative;
    width: 34px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 999px;
    background-color: var(--btn-secondary);
    border: 1px solid var(--border);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  .switch .track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background-color: var(--text-secondary);
    transition: transform 0.2s ease, background-color 0.2s ease;
  }
  .switch input:checked + .track { background-color: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(14px); background-color: #fff; }
  .switch input:focus-visible + .track { outline: 2px solid var(--border-focus); outline-offset: 2px; }

  /* --- Ajuda --- */
  .tooltip-container { position: relative; display: inline-flex; align-items: center; }
  .tooltip-icon {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background-color: var(--btn-secondary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 0.72rem;
    font-weight: 700;
    cursor: help;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tooltip-box {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: calc(100% + 8px);
    right: -8px;
    width: min(280px, calc(100vw - 24px));
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    line-height: 1.4;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    z-index: 100;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .tooltip-container:hover .tooltip-box,
  .tooltip-container:focus-within .tooltip-box { visibility: visible; opacity: 1; }
  /* Interrogants a l'esquerra de la pantalla: el tooltip s'obre cap a la dreta */
  .tooltip-box.tt-right { right: auto; left: -8px; }

  /* --- Botons --- */
  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 500;
    padding: 9px 14px;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn-sm { padding: 6px 10px; font-size: 0.78rem; }
  .btn-secondary { background-color: var(--btn-secondary); color: var(--text-primary); }
  .btn-secondary:hover { background-color: var(--btn-secondary-hover); border-color: var(--border-focus); }
  .btn-primary {
    background-color: var(--accent);
    color: #fff;
    border: none;
    padding: 12px;
    font-size: 0.95rem;
  }
  .btn-primary:hover { background-color: var(--accent-hover); }

  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
  .btn-group-row { display: flex; gap: 10px; width: 100%; }
  .btn-group-row .btn { flex: 1; }

  pre {
    background-color: var(--pre-bg);
    color: var(--pre-text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    font-size: 0.78rem;
    overflow-x: auto;
    max-height: 300px;
    display: none;
    margin: 4px 0 0;
  }

  /* --- Trets --- */
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-bottom: 16px;
  }
  .card-head .card-title { margin: 0; }
  .case-random-btn { margin-left: auto; padding: 6px 12px; font-size: 0.8rem; }
  .traits-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0 8px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .mode-switches { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-left: auto; }

  /* --- Blocs plegables (transició suau en canviar de mode) --- */
  .collapsible {
    display: grid;
    grid-template-rows: 1fr;
    opacity: 1;
    transition: grid-template-rows 0.34s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.26s ease;

    bottom: 3px;

### 9.4 Criteris generals d'avaluació

- Basa't exclusivament en la conversa real i en evidències observables. No inventis preguntes, respostes, conductes ni episodis.
- Diferencia **evidència** (què ha fet o dit), **interpretació** (què pot indicar) i **valoració** (com es tradueix en puntuació).
- No confonguis no preguntar una dada amb no poder obtenir-la perquè el client la desconeix o no la revela. No penalitzis no haver preguntat el que no era pertinent per a l'objectiu de la reunió.
- Aplica la rúbrica de la secció 9.5 tal com està: no n'inventis descriptors ni ponderacions.
- **Primer l'evidència, després el nivell.** Per als criteris F, H i I, localitza primer els missatges de l'estudiant que hi fan referència i després tria el nivell el descriptor del qual s'hi ajusti més. Un nivell superior a 1 requereix almenys una evidència concreta que puguis citar.
- **Nivell complet.** Assigna el nivell més alt els requisits del qual es compleixin del tot. Si dubtes entre dos nivells, tria l'inferior i explica què faltava, perquè una resposta parcial tendeix a semblar millor del que és.
- **Qui treu el tema.** Fixa't si un tema el va plantejar l'estudiant per iniciativa pròpia o si hi va entrar perquè el client el va esmentar. A {codiH} i a I, aquesta diferència separa el nivell 1 del 2.
{notaResum}- **Mencions sense contingut.** Esmentar «sostenibilitat», «ODS», «per a tothom» o «perspectiva de gènere» sense lligar-ho a cap necessitat concreta del projecte no passa del nivell 1.
- No valoris una pregunta com a bona només perquè provoqui una resposta llarga: valora si és pertinent, clara, ben enfocada i útil.
- La puntuació reflecteix la qualitat de l'entrevista, no l'encert a endevinar el perfil ni la satisfacció del client simulat. L'observació de l'estudiant enriqueix el feedback, però no modifica retroactivament les puntuacions.
- **Cada evidència compta en un sol criteri.** Fronteres:
  - El contingut i el tipus de pregunta compten a A; la forma, la claredat, la reformulació, l'obertura i el tancament compten a F.
  - L'estratègia segons el perfil del client compta a G{frontH1}.
  - Les necessitats per raó de sexe o gènere compten a {codiH}; la resta d'impactes socials, ambientals, de seguretat i d'accessibilitat compten a I.
  - El cost i el retorn sense relació amb la sostenibilitat compten a D; el cost de cicle de vida o un compromís entre economia i sostenibilitat compten a I.
- **Valora la conducta, no la persona.** La mateixa intervenció rep el mateix nivell sigui quin sigui el gènere de l'estudiant. El gènere que hagis identificat durant la simulació no intervé en l'avaluació.{notaE6}

| F. Professionalitat comunicativa | 10% | Obertura, claredat i registre escrit, escolta activa i tancament. Descriptors a continuació |
| G. Adaptació al perfil del client | 10% | Adaptar ritme, nivell de detall, preguntes i estratègia al comportament observable; es valora l'adaptació efectiva, no identificar el perfil per nom |

| I. Sostenibilitat i impacte social | 10% | Abast, profunditat, equilibri i concreció en requisits. Descriptors a continuació |

<!-- =========================================================================
     LÒGICA DE L'EINA (no cal tocar-la per canviar textos ni prompts)
     ========================================================================= -->
<script>
let currentLang = "cat";
let promptFontSize = 0.82;
const estat = { sel: {}, dinSel: {}, arees: [], perso: {}, tancament: null, codiAval: "Code 42" };
const TANCAMENT_DEFECTE = Object.freeze({ actiu: true, avis: 10, extra: 4 });
const TANCAMENT_LIMITS = { avis: [2, 50], extra: [1, 10] };
estat.tancament = { ...TANCAMENT_DEFECTE };
const ALEATORI = "aleatori";
let eixEditor = null;
let firmaTrets = "";

/* ===== Utilitats ===== */
const $ = id => document.getElementById(id);
const t = () => UI_LANGS[currentLang];
const esDinamic = () => $("dynamicProfile").checked;
const esAvancat = () => $("advancedMode").checked;
const identitatAleatoria = () => $("randomIdentity").checked;   // v0.6.1: «Client dinàmic», independent de la personalitat
const tret = id => ATRIBUTS.find(a => a.id === id);
const opcio = (attrId, optId) => { const a = tret(attrId); return a ? a.opcions.find(o => o.id === optId) : undefined; };

/* Trets actius (tots es mostren a la interfície) */
function tretsVisibles() {
  return ATRIBUTS.filter(a => a.actiu);
}

/* Selecció del mode dinàmic: cada eix és «aleatori» o té un nivell fix.
   Per defecte, tots aleatoris menys l'E6, que es queda en Neutral. */
function dinPerDefecte() {
  const s = {};
  ATRIBUTS.forEach(a => { s[a.id] = a.eix === "E6" ? a.defecte : ALEATORI; });
  return s;
}

function normalitzarDin(s) {
  const out = dinPerDefecte();
  if (s && typeof s === "object") {
    ATRIBUTS.forEach(a => { if (s[a.id] === ALEATORI || opcio(a.id, s[a.id])) out[a.id] = s[a.id]; });
  }
  return out;
}

const selActual = () => esDinamic() ? estat.dinSel : estat.sel;
const esAleatori = a => esDinamic() && estat.dinSel[a.id] === ALEATORI;

/* Nivell fix de l'eix (0 = primer nivell) */
function nivellFix(a) {
  return Math.max(0, a.opcions.findIndex(o => o.id === selActual()[a.id]));
}

/* L'E6 només s'escriu al prompt si hi pot haver biaix (aleatori o un nivell diferent de Neutral) */
const eixAlPrompt = a => a.eix !== "E6" || esAleatori(a) || nivellFix(a) > 0;
const eixosPrompt = () => tretsVisibles().filter(eixAlPrompt);
const perfilDinamic = () => eixosPrompt().some(esAleatori);

/* Textos de l'eix: els originals o, amb el mode avançat, els editats pel docent */
function perso(a) {
  return esAvancat() ? estat.perso[a.id] || null : null;
}
function textCapcalera(a) {
  const p = perso(a);
  return p && typeof p.capcalera === "string" ? p.capcalera : a.capcalera;
}
function textOpcio(a, o, camp) {
  const p = perso(a);
  const v = p && p.opcions && p.opcions[o.id] ? p.opcions[o.id][camp] : undefined;
  return typeof v === "string" ? v : (o[camp] ?? "");
}

/* Marcadors observables d'un nivell, un per línia; «Mai:» marca el que no ha de fer */
function textMarcadors(a, o, sagnat) {
  return textOpcio(a, o, "marcadors").split("\n").map(l => l.trim()).filter(Boolean)
    .map(l => `${sagnat}- ${l.startsWith("Mai:") ? "**Mai:**" + l.slice(4) : l}`).join("\n");
}
function textNormesE6(a) {
  const p = perso(a);
  return p && typeof p.normes === "string" ? p.normes : P_NORMES_E6;
}
const eixEditat = id => !!estat.perso[id] && Object.keys(estat.perso[id]).length > 0;

/* Només es desen els camps que existeixen i són text */
function normalitzarPerso(p) {
  const out = {};
  if (!p || typeof p !== "object") return out;
  ATRIBUTS.forEach(a => {
    const e = p[a.id];
    if (!e || typeof e !== "object") return;
    const net = {};
    if (typeof e.capcalera === "string") net.capcalera = e.capcalera;
    if (a.eix === "E6" && typeof e.normes === "string") net.normes = e.normes;
    if (e.opcions && typeof e.opcions === "object") {
      a.opcions.forEach(o => {
        const v = e.opcions[o.id];
        if (!v || typeof v !== "object") return;
        const nv = {};
        if (typeof v.prompt === "string") nv.prompt = v.prompt;
        if (typeof v.guia === "string") nv.guia = v.guia;
        if (typeof v.marcadors === "string") nv.marcadors = v.marcadors;
        if (Object.keys(nv).length) (net.opcions = net.opcions || {})[o.id] = nv;
      });
    }
    if (Object.keys(net).length) out[a.id] = net;
  });
  return out;
}

const totesLesArees = () => AREES.map(a => a.id);

/* Substitució en un sol pas (el text de l'usuari no es torna a processar) */
function omplir(plantilla, valors) {
  return plantilla.replace(/\{(\w+)\}/g, (m, k) => (k in valors ? String(valors[k]) : m));
}

/* Atzar criptogràfic quan està disponible */
function rnd(n) {
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] % n;
  }
  return Math.floor(Math.random() * n);
}

const triar = arr => arr[rnd(arr.length)];

function nomAleatori() {
  const genere = rnd(2) ? "f" : "m";
  return { nom: `${triar(NOMS_POOL.prenoms[genere])} ${triar(NOMS_POOL.cognoms)}`, genere };
}

/* Gènere del prenom segons el pool ("f", "m" o null si no és a la llista) */
function generePrenom(nomComplet) {
  const prenom = textNet(nomComplet).split(" ")[0] || "";
  if (NOMS_POOL.prenoms.f.includes(prenom)) return "f";
  if (NOMS_POOL.prenoms.m.includes(prenom)) return "m";
  return null;
}

/* Càrrec en la forma del gènere indicat. Si no se sap, només càrrecs invariables. */
function carrecAleatori(genere, excepte) {
  let pool = genere ? CARRECS.map(c => c[genere]) : CARRECS.filter(c => c.m === c.f).map(c => c.m);
  const alternatives = pool.filter(c => c !== excepte);
  if (alternatives.length) pool = alternatives;
  return triar(pool);
}

function textNet(s) { return (s || "").replace(/\s+/g, " ").trim(); }

/* ===== Selecció i regles ===== */
function selPerDefecte() {
  const s = {};
  ATRIBUTS.forEach(a => { s[a.id] = a.defecte; });
  return s;
}

function normalitzarSel(s) {
  const out = selPerDefecte();
  if (s && typeof s === "object") {
    ATRIBUTS.forEach(a => { if (opcio(a.id, s[a.id])) out[a.id] = s[a.id]; });
  }
  return out;
}

/* Una regla s'aplica només si tots els seus trets són visibles */
function reglesAplicables() {
  const ids = tretsVisibles().map(a => a.id);
  return REGLES.filter(r => Object.keys(r.cond).every(k => ids.includes(k)));
}

function reglaViolada(sel, attrId) {
  return reglesAplicables().find(r =>
    (!attrId || attrId in r.cond) &&
    Object.entries(r.cond).every(([a, v]) => sel[a] === v)
  ) || null;
}

function selAleatoria() {
  for (let i = 0; i < 500; i++) {
    const s = { ...estat.sel };
    tretsVisibles().filter(a => a.eix !== "E6").forEach(a => { s[a.id] = a.opcions[rnd(a.opcions.length)].id; });
    if (!reglaViolada(s)) return s;
  }
  return selPerDefecte();
}


/* ===== Tema ===== */
function alternarTema() {
  const clar = document.body.classList.toggle("light-theme");

/* Opcions de la fila: en mode dinàmic, «Aleatori» va primer */
const opcionsFila = at => esDinamic() ? [{ id: ALEATORI }, ...at.opcions] : at.opcions;

function crearFila(at) {
  const row = document.createElement("div");
  row.className = "trait-row";
  row.dataset.attr = at.id;
  const nom = document.createElement("div");
  nom.className = "trait-name";
  const etiqueta = document.createElement("span");
  etiqueta.textContent = at.nom[currentLang];
  nom.appendChild(etiqueta);
  if (esAvancat()) {
    const g = document.createElement("button");
    g.type = "button";
    g.className = "gear-btn";
    g.innerHTML = ICONA_ENGRANATGE;
    g.addEventListener("click", () => obrirEditor(at.id));
    nom.appendChild(g);
  }
  const grid = document.createElement("div");
  grid.className = "seg-grid no-anim";
  grid.style.setProperty("--n", opcionsFila(at).length);
  const indicador = document.createElement("span");
  indicador.className = "seg-indicator";
  indicador.setAttribute("aria-hidden", "true");
  grid.appendChild(indicador);
  row.appendChild(nom);
  row.appendChild(grid);
  return { row, grid };
}

/* Construeix les files només quan canvien els trets visibles o l'idioma.
   Si no, actualitza les existents perquè l'indicador taronja pugui lliscar. */
function renderTrets(forcar) {
  const cont = $("traitsContainer");
  const firma = [currentLang, esDinamic(), esAvancat(), tretsVisibles().map(a => a.id).join(",")].join("|");
  if (!forcar && firma === firmaTrets && cont.children.length) { actualitzarTrets(); return; }
  firmaTrets = firma;
  cont.innerHTML = "";

  tretsVisibles().forEach(at => {
    const { row, grid } = crearFila(at);
    grid.setAttribute("role", "group");
    grid.setAttribute("aria-label", at.nom[currentLang]);

    opcionsFila(at).forEach(o => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = o.id === ALEATORI ? "seg-btn seg-random" : "seg-btn";
      b.dataset.opt = o.id;
      b.textContent = o.id === ALEATORI ? t().segRandom : o.nom[currentLang];
      b.addEventListener("click", () => {
        const mapa = selActual();
        if (b.getAttribute("aria-disabled") === "true" || mapa[at.id] === o.id) return;
        mapa[at.id] = o.id;
        actualitzarTrets();
        renderAvis();
        refrescarVistes();
      });
      grid.appendChild(b);
    });

    const desc = document.createElement("div");
    desc.className = "trait-desc";
    row.appendChild(desc);
    cont.appendChild(row);
  });

  actualitzarTrets(true);
  // Primer dibuix sense animació; a partir d'aquí l'indicador llisca
  const reactivar = () => cont.querySelectorAll(".seg-grid.no-anim").forEach(g => g.classList.remove("no-anim"));
  if (window.requestAnimationFrame) requestAnimationFrame(() => requestAnimationFrame(reactivar));
  else reactivar();
}

/* Descripció que surt sota cada eix */
function descripcioEix(at) {
  const x = t();
  const sel = selActual()[at.id];
  let text = sel === ALEATORI
    ? omplir(x.descRandom, { n: at.opcions.length })
    : opcio(at.id, sel)?.descripcio[currentLang] || "";
  if (at.eix === "E6" && eixAlPrompt(at)) text += " " + x.noteE6Warn;
  return text;
}

function actualitzarTrets(inicial) {
  const cont = $("traitsContainer");
  const din = esDinamic();
  const mapa = selActual();
  tretsVisibles().forEach(at => {
    const row = cont.querySelector(`[data-attr="${at.id}"]`);
    if (!row) return;
    const idx = Math.max(0, opcionsFila(at).findIndex(o => o.id === mapa[at.id]));
    const grid = row.querySelector(".seg-grid");
    grid.style.setProperty("--i", idx);
    grid.classList.toggle("is-random", mapa[at.id] === ALEATORI);

    const g = row.querySelector(".gear-btn");
    if (g) {
      const editat = eixEditat(at.id);
      g.classList.toggle("edited", editat);
      g.title = editat ? t().ttGearEdited : t().ttGear;
      g.setAttribute("aria-label", `${g.title}: ${at.nom[currentLang]}`);
    }

    row.querySelectorAll(".seg-btn").forEach(b => {
      const id = b.dataset.opt;
      const actiu = mapa[at.id] === id;
      b.setAttribute("aria-pressed", actiu ? "true" : "false");
      if (id === ALEATORI) {
        b.title = omplir(t().descRandom, { n: at.opcions.length });
        return;
      }
      const o = opcio(at.id, id);
      const regla = actiu || din ? null : reglaViolada({ ...estat.sel, [at.id]: o.id }, at.id);
      if (regla) {
        b.setAttribute("aria-disabled", "true");
        b.title = t().ttIncompat + regla.motiu[currentLang];
      } else {
        b.removeAttribute("aria-disabled");
        b.title = o.descripcio[currentLang];
      }
    });

    const desc = row.querySelector(".trait-desc");
    const text = descripcioEix(at);
    if (desc.textContent === text) return;
    if (inicial) { desc.textContent = text; return; }
    desc.classList.add("fade");
    clearTimeout(desc._t);
    desc._t = setTimeout(() => { desc.textContent = text; desc.classList.remove("fade"); }, 140);
  });
}

/* ===== Mode avançat: editor dels textos d'un eix ===== */
function valorEditor(a, camp, optId) {
  if (camp === "capcalera") return textCapcalera(a);
  if (camp === "normes") return textNormesE6(a);
  return textOpcio(a, opcio(a.id, optId), camp);
}

function valorOriginal(a, camp, optId) {
  if (camp === "capcalera") return a.capcalera;
  if (camp === "normes") return P_NORMES_E6;
  return opcio(a.id, optId)[camp] ?? "";
}

/* Desa només el que difereix de l'original */
function desarCampEditor(a, camp, optId, valor) {
  const original = valorOriginal(a, camp, optId);
  const p = estat.perso[a.id] || {};
  if (camp === "capcalera" || camp === "normes") {
    if (valor === original) delete p[camp]; else p[camp] = valor;
  } else {
    const ops = p.opcions || {};
    const o = ops[optId] || {};
    if (valor === original) delete o[camp]; else o[camp] = valor;
    if (Object.keys(o).length) ops[optId] = o; else delete ops[optId];
    if (Object.keys(ops).length) p.opcions = ops; else delete p.opcions;
  }
  if (Object.keys(p).length) estat.perso[a.id] = p; else delete estat.perso[a.id];
  $("edReset").disabled = !eixEditat(a.id);
  actualitzarTrets();
  refrescarVistes();
}

function renderEditor() {
  const a = tret(eixEditor);
  if (!a) return;
  const x = t();
  $("edTitle").textContent = `${a.nom[currentLang]} (${a.eix})`;
  $("edIntro").textContent = x.edIntro;
  $("edReset").textContent = x.edReset;
  $("edReset").disabled = !eixEditat(a.id);
  $("edDone").textContent = x.edDone;
  $("edClose").title = x.edClose;
  $("edClose").setAttribute("aria-label", x.edClose);

  const body = $("edBody");
  body.innerHTML = "";
  const seccio = titol => {
    const sec = document.createElement("div");
    sec.className = "ed-section";
    if (titol) {
      const h = document.createElement("h3");
      h.textContent = titol;
      sec.appendChild(h);
    }
    body.appendChild(sec);
    return sec;
  };
  const camp = (sec, etiqueta, nomCamp, optId) => {
    const id = `ed_${nomCamp}_${optId || "eix"}`;
    const l = document.createElement("label");
    l.className = "ed-label";
    l.htmlFor = id;
    l.textContent = etiqueta;
    const ta = document.createElement("textarea");
    ta.id = id;
    ta.value = valorEditor(a, nomCamp, optId);
    ta.rows = Math.min(14, Math.ceil(ta.value.length / 90) + 1);
    ta.addEventListener("input", () => desarCampEditor(a, nomCamp, optId, ta.value));
    sec.appendChild(l);
    sec.appendChild(ta);
  };

  camp(seccio(""), x.edHeader, "capcalera");
  a.opcions.forEach((o, k) => {
    const sec = seccio(`${k + 1}. ${o.nom[currentLang]}`);
    camp(sec, x.edBehaviour, "prompt", o.id);
    camp(sec, x.edMarkers, "marcadors", o.id);
    camp(sec, x.edGuide, "guia", o.id);
  });
  if (a.eix === "E6") camp(seccio(x.edNorms), x.edNorms, "normes");
}

/* Omple el cas amb un exemple diferent de l'actual. Si el cas s'ha editat a mà, demana confirmació. */
let casActual = 0;
function casAleatori() {
  const oberta = $("infoOberta").value.trim();
  const oculta = $("infoOculta").value.trim();
  const esExemple = CASOS_EXEMPLE.some(c => c.infoOberta === oberta && c.infoOculta === oculta);
  if ((oberta || oculta) && !esExemple && !confirm(t().confirmRandomCase)) return;
  let i;
  do { i = rnd(CASOS_EXEMPLE.length); } while (i === casActual && CASOS_EXEMPLE.length > 1);
  casActual = i;
  const c = CASOS_EXEMPLE[i];
  $("assistantName").value = c.nomIntern;
  $("companyName").value = c.empresa;
  $("infoOberta").value = c.infoOberta;
  $("infoOculta").value = c.infoOculta;
  refrescarVistes();
}

/* ===== Compilació del prompt ===== */
function idiomesSeleccionats() {
  const s = [];
  if ($("lang_cat").checked) s.push({ id: "cat", nom: "català" });
  if ($("lang_es").checked) s.push({ id: "es", nom: "castellà" });
  if ($("lang_en").checked) s.push({ id: "en", nom: "anglès" });
  return s;
}

/* "català", "català o castellà", "català, castellà o anglès" */
/* "català", "català i castellà", "català, castellà i anglès" */
function llista(noms, conj) {
  return noms.length < 2 ? noms.join("") : `${noms.slice(0, -1).join(", ")} ${conj} ${noms.at(-1)}`;
}

const NOMBRES = ["zero", "un", "dos", "tres", "quatre", "cinc", "sis", "set"];

function compilarIdioma() {
  const sel = idiomesSeleccionats();
  if (sel.length === 0) sel.push({ id: "cat", nom: "català" });
  const inici = sel[0].nom;
  if (!$("forceLanguages").checked) return omplir(P_IDIOMA_LLIURE, { inici });
  if (sel.length === 1) return omplir(P_IDIOMA_FORCAT_UN, { inici });
  return omplir(P_IDIOMA_FORCAT_DIVERSOS, { inici, permesos: llista(sel.map(l => l.nom), "i") });
}

function nomOrganitzacio() {
  const e = textNet($("companyName").value);
  return e ? `«${e}»` : "l'organització que encarrega el projecte";
}

function textArees() {
  let arees = AREES.filter(a => estat.arees.includes(a.id));
  if (!arees.length) arees = AREES;
  return arees.map(a => `   - *${a.prompt}:* ${a.llista}.`).join("\n");
}

function compilarIdentitat() {
  const nom = textNet($("charName").value);
  const carrec = textNet($("charRole").value);
  if (identitatAleatoria() || (!nom && !carrec)) {
    return omplir(P_IDENTITAT_DINAMICA, { organitzacio: nomOrganitzacio(), abast: P_ABAST, arees: textArees() });
  }
  return omplir(P_IDENTITAT_FIXA, {
    organitzacio: nomOrganitzacio(),
    nom: nom || "tria'l tu, de manera coherent amb el càrrec",
    carrec: carrec || "tria'l tu, de manera coherent amb el cas",
    abast: P_ABAST
  });
}

function tretLliureActiu() {
  return textNet($("freeTrait").value).slice(0, TRET_LLIURE.maxCaracters);
}

/* L'E6 surt al prompt (i s'avalua H1) només si hi pot haver biaix */
const ambE6 = () => eixosPrompt().some(a => a.eix === "E6");

/* Llista de columnes de la llavor, només amb els eixos que se sortegen */
function textColumnes(aleatoris) {
  return aleatoris.map((a, j) =>
    `      - ${a.eix}: la ${ORDINALS_COLUMNA[j]} columna${j === 0 ? " (el primer dígit de cada bloc)" : ""}`
  ).join("\n");
}

/* Format de la línia CALC, amb lletres perquè el model no copiï dígits d'exemple */
function textExempleCalc(aleatoris) {
  const primer = `${aleatoris[0].eix} a+b+c+d=suma→nivell`;
  return aleatoris.length > 1 ? `${primer}; ${aleatoris[1].eix} …; …` : primer;
}

/* «3 per a E1, E2 i E3; 4 per a E4», segons el nombre de nivells de cada eix aleatori */
function textDivisors(aleatoris) {
  const grups = {};
  aleatoris.forEach(a => { (grups[a.opcions.length] = grups[a.opcions.length] || []).push(a.eix); });
  return Object.keys(grups).sort().map(n => `${n} per a ${llista(grups[n], "i")}`).join("; ");
}

function compilarPerfil() {
  const eixos = eixosPrompt();
  const aleatoris = eixos.filter(esAleatori);
  const din = aleatoris.length > 0;
  const parts = [];

  parts.push(omplir(din ? P_PERFIL_INTRO_DINAMIC : P_PERFIL_INTRO_FIX, {
    nEixos: NOMBRES[eixos.length] || eixos.length,
    rangEixos: `${eixos[0].eix} a ${eixos.at(-1).eix}`
  }));

  let num = 1;
  if (din) {
    const fixos = eixos.filter(a => !esAleatori(a));
    const rangs = llista(aleatoris.map(a => `${a.eix} 1–${a.opcions.length}`), "i");
    const nivell = a => `${nivellFix(a) + 1} (${a.opcions[nivellFix(a)].etiqueta.replace(/\s*\(.*\)$/, "")})`;
    let pas2 = omplir(P_SORTEIG_TOT, { rangs });
    if (fixos.length) {
      pas2 = omplir(P_SORTEIG_PARCIAL, {
        rangs,
        fixos: fixos.length === 1
          ? omplir(P_FIX_UN, { eix: fixos[0].eix, nivell: nivell(fixos[0]) })
          : omplir(P_FIX_DIVERSOS, { eixos: llista(fixos.map(a => a.eix), "i"), nivells: llista(fixos.map(a => `${a.eix} = ${nivell(a)}`), "i") }),
        escriu: fixos.length === 1 ? P_ESCRIU_UN : P_ESCRIU_DIVERSOS,
        exemple: eixos.map(a => esAleatori(a) ? "x" : nivellFix(a) + 1).join("-")
      });
    }
    parts.push(omplir(P_OBTENCIO, {
      format: eixos.map(a => a.eix).join("-"),
      pas2,
      quins: fixos.length ? P_QUINS_PARCIAL : P_QUINS_TOT,
      linTorn: tancament().actiu ? " Posa la línia TORN (secció 8) just a sota de la línia PERFIL, abans de la línia en blanc." : "",
      columnes: textColumnes(aleatoris),
      divisors: textDivisors(aleatoris),
      exempleCalc: textExempleCalc(aleatoris)
    }));
    num = 2;
  }

  parts.push(omplir(P_APLICACIO, {
    num: `7.${num}`,
    funcions: eixos.map(a => `${a.eix} ${FUNCIO_EIX[a.eix]}`).join("; ")
  }));

  eixos.forEach(a => {
    let bloc = `#### ${a.eix} — ${textCapcalera(a)}\n\n`;
    if (esAleatori(a)) {
      bloc += a.opcions.map((o, k) => {
        const m = textMarcadors(a, o, "   ");
        return `${k + 1}. **${o.etiqueta}.** ${textOpcio(a, o, "prompt")} *(Guia: ${textOpcio(a, o, "guia")})*` + (m ? "\n" + m : "");
      }).join("\n");
    } else {
      const k = nivellFix(a);
      const o = a.opcions[k];
      const titol = din ? P_NIVELL_FIX_DINAMIC : "Nivell assignat";
      bloc += `${titol}: **${k + 1}. ${o.etiqueta}.** ${textOpcio(a, o, "prompt")} *(Guia: ${textOpcio(a, o, "guia")})*`;
      const m = textMarcadors(a, o, "");
      if (m) bloc += "\n\n" + m;
    }
    if (a.eix === "E6") bloc += "\n\n" + textNormesE6(a);
    parts.push(bloc);
  });

  const lliure = tretLliureActiu();
  if (lliure) parts.push(omplir(P_TRET_LLIURE, { text: lliure }));

  parts.push(P_NORMES_MANIFESTACIO);
  parts.push(P_NORMES_PERFIL);
  parts.push(omplir(P_COMPROVACIO, { num: `7.${num + 1}` }));
  return parts.join("\n\n");
}

function compilarSystemPrompt() {
  const din = perfilDinamic();
  const tc = tancament().actiu;
  return [
    P_FUNCIO,
    compilarIdioma(),
    compilarIdentitat(),
    omplir(P_CAS, { infoOberta: $("infoOberta").value.trim(), infoOculta: $("infoOculta").value.trim() }),
    P_INFORMACIO,
    P_REQUISITS,
    compilarPerfil(),
    omplir(P_CONDUCCIO, { liniaPerfil: din
      ? (tc ? "línia de llavor, línia de càlcul, línia de perfil i línia de torn, " : "línia de llavor, línia de càlcul i línia de perfil, ")
      : (tc ? "línia de torn, " : "") }) + (tc ? "\n\n" + textDurada(din) : ""),
    omplir(P_AVALUACIO, {
      comanda: codiAvaluacio(),
      liniaPerfilAval: din
        ? (tc ? "no escrius les línies de llavor, de càlcul, de perfil ni de torn, " : "no escrius les línies de llavor, de càlcul ni de perfil, ")
        : (tc ? "no escrius la línia de torn, " : ""),
      finalitzacio: tc ? P_FINAL_TORNS : P_FINAL_LLIURE,
      notaResum: tc ? P_NOTA_RESUM : "",
      notaE6: ambE6() ? "" : P_NOTA_SENSE_E6,
      ...VARIANT_H[ambE6() ? "complet" : "simple"]
    })
  ].join("\n\n---\n\n");
}

  });
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === `tab-${id}`));
}

function comptarRequisits() {
  const linies = $("infoOculta").value.split("\n").map(l => l.trim()).filter(Boolean);
  const vinyetes = linies.filter(l => /^[-•*]/.test(l));
  return (vinyetes.length || linies.length);
}

function filaFitxa(k, v, opts = {}) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "fitxa-fila";
  b.innerHTML = `<span class="k"></span><span class="v"></span>`;
  b.querySelector(".k").textContent = k;
  if (opts.title) b.title = opts.title;
  const vEl = b.querySelector(".v");
  vEl.textContent = v || v06().sense;
  if (!v) vEl.classList.add(opts.falta ? "falta" : "buit");
  if (opts.random) vEl.classList.add("random");
  if (opts.editat) vEl.classList.add("editat");
  b.addEventListener("click", () => {
    activarPestanya(opts.tab);
    if (opts.focus) {
      const el = typeof opts.focus === "string" ? $(opts.focus) : opts.focus();
      if (el) {
        el.scrollIntoView({ block: "center", behavior: "smooth" });
        if (el.classList.contains("trait-row")) {
          el.classList.remove("destacat"); void el.offsetWidth; el.classList.add("destacat");
        } else if (el.focus) el.focus({ preventScroll: true });
      }
    }
  });
  return b;
}

  });

  const idiomes = idiomesSeleccionats();
  const textIdioma = (idiomes.length ? idiomes.map(l => NOMS_IDIOMA[l.id]) : [NOMS_IDIOMA.cat]).join(", ")
    + ($("forceLanguages").checked ? x.forcat : "");
  const tc = estat.tancament;
  const reunio = [
    filaFitxa(x.idioma, textIdioma, { tab: "reunio", focus: "lang_cat" }),
    filaFitxa(x.durada, tc.actiu ? x.torns(tc.avis, tc.avis + tc.extra) : x.sensetorns, { tab: "reunio", focus: "meetingClose" }),
    filaFitxa(x.gCodi, codiAvaluacio(), { tab: "reunio", focus: () => esAvancat() ? $("evalCode") : (sacsejarModeAvancat(), null),
      title: esAvancat() ? "" : x.codiActivaAvancat })
  ];

  cont.replaceChildren(
    grupFitxa(x.gProjecte, projecte),
    grupFitxa(x.gIdentitat, identitat),
    grupFitxa(x.gPersonalitat, personalitat),
    grupFitxa(x.gReunio, reunio)
  );
}

/* ===== Codi per activar l'avaluació ===== */
/* Retorna el problema del codi (clau de text) o null si és vàlid */
function problemaCodi(codi) {
  if (!codi) return "buit";
  if (codi.length < CODI_LIMITS.min) return "curt";
  if (codi.length > CODI_LIMITS.max) return "llarg";
  if (/[«»\n]/.test(codi)) return "caracters";
  if (CODI_PROHIBITS.includes(codi.toLowerCase())) return "comu";
  return null;
}

/* Com la personalització dels eixos, el codi propi només s'aplica en mode avançat */
function codiAvaluacio() {
  const c = (estat.codiAval || "").trim();
  return esAvancat() && !problemaCodi(c) ? c : COMANDA_AVALUACIO;
}

function renderCodi() {
  const x = v06(), c = (estat.codiAval || "").trim();
  if (document.activeElement !== $("evalCode")) $("evalCode").value = estat.codiAval;
  const p = problemaCodi(c);
  const nota = $("evalCodeNote");
  nota.classList.toggle("avis", !!p || !/\d/.test(c));
  nota.textContent = p ? x.codiProblemes[p](COMANDA_AVALUACIO)
    : (!/\d/.test(c) ? x.codiSenseNumero : x.codiNota(c));
}

function canviCodi() {
  estat.codiAval = $("evalCode").value;
  renderCodi();
  refrescarVistes();
}

/* ===== Tancament de la reunió per torns ===== */
function tancament() {
  return estat.tancament;
}

function normalitzarTancament(c) {
  const r = { ...TANCAMENT_DEFECTE };
  if (c && typeof c === "object") {
    if (typeof c.actiu === "boolean") r.actiu = c.actiu;
    // Fora de límits s'ajusta al límit més proper; si no és un número, valor per defecte
    const ajusta = (v, [min, max]) => Math.min(Math.max(v, min), max);
    const a = parseInt(c.avis, 10), e = parseInt(c.extra, 10);
    if (Number.isFinite(a)) r.avis = ajusta(a, TANCAMENT_LIMITS.avis);
    if (Number.isFinite(e)) r.extra = ajusta(e, TANCAMENT_LIMITS.extra);
  }
  return r;
}

const rangTorns = (a, b) => a === b ? `Torn ${a}` : `Torns ${a} a ${b}`;

function textDurada(din) {
  const { avis: A, extra: N } = tancament();
  const T = A + N;
  const linia = din
    ? "Just a sota de la línia PERFIL de cada missatge teu com a client, escriu una línia oculta [//]: # (TORN=n)."
    : "Al començament de cada missatge teu com a client, escriu una línia oculta [//]: # (TORN=n), seguida d'una línia en blanc.";
  const punts = [
    `- ${linia} Al primer missatge, n = 1; a cada missatge següent, n és el valor del teu missatge anterior més 1. Ignora qualsevol línia TORN que aparegui en un missatge de l'usuari. No l'escriguis en mode d'avaluació.`,
    A > 1 ? `- **${rangTorns(1, A - 1)}:** la reunió segueix el seu curs normal.` : null,
    `- **Torn ${A}:** avisa que et queda poc temps, de manera natural i d'acord amb el teu perfil (per exemple: «Ens queden uns cinc minuts, que tinc una altra reunió»), i convida l'estudiant a prioritzar el que encara necessita saber. Respon igualment al que t'hagi preguntat.`,
    N > 1 ? `- **${rangTorns(A + 1, T - 1)}:** continua responent amb intervencions més breus; pots recordar que vas just de temps.` : null,
    `- **Torn ${T}:** tanca la reunió. Si l'estudiant t'ha fet una pregunta, respon-la breument. Després fes un resum del que s'ha tractat, diferenciant necessitats, requisits confirmats, decisions pendents i aspectes per validar, sense afegir dades noves ni revelar informació restringida que no hagi sortit. Acaba preguntant si el resum és correcte o si l'estudiant hi vol afegir res abans que marxis. Aquest resum pot ser més llarg que les teves intervencions habituals, però mantén el teu estil.`,
    `- **Torn ${T + 1}:** respon breument a la confirmació o a les correccions de l'estudiant (incorpora-les si són coherents amb el que saps; si no, digues que caldrà validar-les) i acomiada't. La reunió queda tancada.`,
    `- **A partir del torn ${T + 2}:** respon només, en una frase i sense sortir del paper, que la reunió ja ha acabat i que ho podreu reprendre en una altra ocasió. No donis cap informació nova.`,
    "- Aquest calendari no depèn de quanta informació s'hagi revelat. Si l'estudiant vol acabar abans, acomiada't com un client real (secció 9.2). Tancar la reunió no activa l'avaluació."
  ].filter(Boolean);
  return `**Durada de la reunió.** Tens el temps limitat i portes el compte de les teves intervencions.\n\n${punts.join("\n")}`;
}

function descarregarJson() {
  if (campsQueFalten().length) return;
  const dades = generarEstructuraJSON();
  const blob = new Blob([JSON.stringify(dades, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `${dades.name}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

function feedbackBoto(btn, text, ok, original) {
  btn.textContent = text;
  btn.style.borderColor = ok ? "var(--success)" : "var(--error)";
  btn.style.color = ok ? "var(--success)" : "var(--error)";
  setTimeout(() => {
    btn.textContent = original();
    btn.style.borderColor = "";
    btn.style.color = "";
  }, 2200);
}

function copiarPrompt() {
  if (campsQueFalten().length) return;
  const text = compilarSystemPrompt();
  const btn = $("ui_btn_copy");
  const exit = () => feedbackBoto(btn, t().copied, true, () => t().btnCopy);
  const error = () => feedbackBoto(btn, t().copyError, false, () => t().btnCopy);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(exit).catch(() => copiaAlternativa(text, exit, error));
  } else {
    copiaAlternativa(text, exit, error);
  }
}

function copiaAlternativa(text, exit, error) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-999999px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    ok ? exit() : error();
  } catch (e) {
    error();
  }
}

/* ===== Importació ===== */
function aplicarIdiomes(llista) {
  $("lang_cat").checked = llista.includes("cat");
  $("lang_es").checked = llista.includes("es");
  $("lang_en").checked = llista.includes("en");
  actualitzarNotaLlengua();
}

/* Busca a quin tret i opció correspon un text de prompt */
function trobarOpcioPerText(text) {
  for (const a of ATRIBUTS) {
    const o = a.opcions.find(op => text.includes(op.prompt));
    if (o) return { attrId: a.id, optId: o.id };
  }
  return null;
}

function seccio(sp, capcalera) {
  const i = sp.indexOf(capcalera);
  if (i === -1) return null;
  const inici = i + capcalera.length;
  const fi = sp.indexOf("\n=== ", inici);
  return sp.slice(inici, fi === -1 ? sp.length : fi).trim();
}

function importarDesDeConfig(c) {
  if (c.assistantName) $("assistantName").value = c.assistantName;
  if (c.charName) $("charName").value = c.charName;
  if (c.charRole) $("charRole").value = c.charRole;
  $("companyName").value = typeof c.empresa === "string" ? c.empresa : "";
  if (Array.isArray(c.agentLangs)) aplicarIdiomes(c.agentLangs);
  else if (c.agentLang) aplicarIdiomes([c.agentLang]);
  if (c.forceLanguages !== undefined) $("forceLanguages").checked = !!c.forceLanguages;
  if (c.infoOberta !== undefined) $("infoOberta").value = c.infoOberta;
  if (c.infoOculta !== undefined) $("infoOculta").value = c.infoOculta;

  // Trets de versions anteriors amb ids diferents s'ignoren (queden els valors per defecte)
  estat.sel = normalitzarSel(c.trets);
  estat.tancament = normalitzarTancament(c.tancament);   // configs anteriors a la v0.5.7: valors per defecte
  estat.codiAval = typeof c.codiAvaluacio === "string" ? c.codiAvaluacio.slice(0, CODI_LIMITS.max) : COMANDA_AVALUACIO;
  $("freeTrait").value = typeof c.tretLliure === "string" ? c.tretLliure.slice(0, TRET_LLIURE.maxCaracters) : "";
  $("dynamicProfile").checked = !!c.dynamicProfile;

  if (c.dinTrets) {
    // v0.5.3 o posterior
    estat.dinSel = normalitzarDin(c.dinTrets);
    $("randomIdentity").checked = typeof c.clientDinamic === "boolean"
      ? c.clientDinamic
      : !!c.dynamicProfile && c.randomIdentity !== false;
    if (Array.isArray(c.arees)) estat.arees = AREES.filter(a => c.arees.includes(a.id)).map(a => a.id);
    estat.perso = normalitzarPerso(c.personalitzacio);
    $("advancedMode").checked = !!c.advancedMode;
  } else if (c.advancedMode) {
    // Fins a la v0.5.2, el mode avançat afegia l'E6 (en dinàmic, sortejat)
    estat.dinSel.genere = ALEATORI;
  } else {
    estat.sel.genere = "neutral";
  }
}

/* Prompt v0.4+ (estructura del prompt de referència, seccions «## 1.» a «## 9.») */
function importarDesDePromptV4(sp) {
  const mOrg = sp.match(/Ets un representant fictici de «(.+?)»\./);
  $("companyName").value = mOrg ? mOrg[1].trim() : "";

  const dinamic = sp.includes("### 7.1 Obtenció i persistència");
  $("dynamicProfile").checked = dinamic;

  const mId = sp.match(/^- Nom: (.+)\n- Càrrec: (.+)$/m);
  if (mId) {
    $("charName").value = mId[1].trim();
    $("charRole").value = mId[2].trim();
  }

  const oberta = sp.match(/<informacio_oberta>\n?([\s\S]*?)\n?<\/informacio_oberta>/);
  if (oberta) $("infoOberta").value = oberta[1].trim();
  const restringida = sp.match(/<informacio_restringida>\n?([\s\S]*?)\n?<\/informacio_restringida>/);
  if (restringida) $("infoOculta").value = restringida[1].trim();

  const noms = { "català": "cat", "castellà": "es", "anglès": "en" };
  const mInici = sp.match(/^- Idioma inicial: (.+)$/m);
  const mPermesos = sp.match(/^- Idiomes permesos: (.+)$/m);
  $("forceLanguages").checked = !!mPermesos;
  const font = (mPermesos ? mPermesos[1] : (mInici ? mInici[1] : "català")).toLowerCase();
  aplicarIdiomes(Object.keys(noms).filter(n => font.includes(n)).map(n => noms[n]));

  // Eixos amb nivell fix (en dinàmic, la resta dels que surten al prompt són aleatoris)
  estat.sel = selPerDefecte();
  const desti = dinamic ? estat.dinSel : estat.sel;
  if (dinamic) {
    [...sp.matchAll(/^#### (E\d) — /gm)].forEach(m => {
      const a = ATRIBUTS.find(x => x.eix === m[1]);
      if (a) estat.dinSel[a.id] = ALEATORI;
    });
  }
  [...sp.matchAll(/^#### (E\d) — [^\n]*\n\n(?:Nivell assignat|Nivell fix \(no se sorteja\)): \*\*(\d+)\./gm)].forEach(m => {
    const a = ATRIBUTS.find(x => x.eix === m[1]);
    const o = a && a.opcions[Number(m[2]) - 1];
    if (o) desti[a.id] = o.id;
  });

  // Identitat aleatòria i àrees permeses
  $("randomIdentity").checked = !mId;
  const arees = AREES.filter(a => sp.includes(`*${a.prompt}:*`)).map(a => a.id);
  if (arees.length) estat.arees = arees;

  // Codi d'avaluació: si el prompt en porta un de propi, es recupera en mode avançat
  const mCodi = sp.match(/conté literalment «([^»\n]+)»/);
  estat.codiAval = mCodi ? mCodi[1] : COMANDA_AVALUACIO;
  if (estat.codiAval !== COMANDA_AVALUACIO) $("advancedMode").checked = true;

  // Tancament per torns: es recupera del prompt; si no en porta, queda desactivat
  const mAvis = sp.match(/^- \*\*Torn (\d+):\*\* avisa que et queda poc temps/m);
  const mTanca = sp.match(/^- \*\*Torn (\d+):\*\* tanca la reunió/m);
  estat.tancament = mAvis && mTanca
    ? normalitzarTancament({ actiu: true, avis: mAvis[1], extra: Number(mTanca[1]) - Number(mAvis[1]) })
    : { ...TANCAMENT_DEFECTE, actiu: false };

  const mLliure = sp.match(/^\*\*Tret addicional\*\* \(sempre actiu, sigui quin sigui el perfil\): (.+)$/m);
  $("freeTrait").value = mLliure ? mLliure[1].trim() : "";
}

function importarDesDePrompt(data) {
  if (data.name) $("assistantName").value = data.name;
  const sp = data.system_prompt || "";
  if (sp.includes("## 1. FUNCIÓ I OBJECTIU PEDAGÒGIC")) { importarDesDePromptV4(sp); return; }

  const mRol31 = sp.match(/^Ets (.+?)\. El teu càrrec és (.+?) a (?:l'organització «(.+?)»|l'empresa)\./m);
  const mRol30 = sp.match(/^Ets\s+([^,\n]+),\s+(.+?)\s+de l'empresa\./m);
  $("companyName").value = "";
  if (mRol31) {
    $("charName").value = mRol31[1].trim();
    $("charRole").value = mRol31[2].trim();
    if (mRol31[3]) $("companyName").value = mRol31[3].trim();
  } else if (mRol30) {
    $("charName").value = mRol30[1].trim();
    $("charRole").value = mRol30[2].trim();
  } else if (data.description) {
    const m = data.description.match(/(?:Client|Stakeholder) simulat:\s*([^(·]+)/i);
    if (m) $("charName").value = m[1].trim();
  }

  const context = seccio(sp, "=== EL CAS ===")?.replace(/^Això ho saps i ho pots explicar[^\n]*\n/, "") ?? seccio(sp, "=== CONTEXT DE L'EMPRESA ===") ?? (sp.match(/CONTEXT GENERAL DE L'EMPRESA:\s*\n([\s\S]*?)\n\s*(?:PERFIL|INFORMACIÓ RESERVADA)/) || [])[1];
  if (context) $("infoOberta").value = context.trim();

  let reservada = seccio(sp, "=== INFORMACIÓ RESERVADA ===");
  if (reservada) reservada = reservada.replace(/^(?:Aquesta informació només la reveles|Això també ho saps)[^\n]*\n/, "");
  else reservada = (sp.match(/INFORMACIÓ RESERVADA I CUSTODIADA:\s*\n([\s\S]*?)\n\s*DIRECTRIUS DE COMPORTAMENT/) || [])[1];
  if (reservada) $("infoOculta").value = reservada.trim();

  const idioma = (seccio(sp, "=== IDIOMA ===") || sp).toLowerCase();
  $("forceLanguages").checked = idioma.includes("només parles") || idioma.includes("gestió estricta") || idioma.includes("gestió lingüística estricta");
  aplicarIdiomes(["cat", "es", "en"].filter((id, i) => idioma.includes(["català", "castellà", "anglès"][i])));

  estat.sel = selPerDefecte();
  let avancat = false;
  let lliure = "";

  const dinamic = sp.includes("=== EL TEU PERFIL (ES DEFINEIX AL PRIMER MISSATGE) ===");
  $("dynamicProfile").checked = dinamic;

  if (dinamic) {
    const blocs = sp.split(/^EIX \d+ — .+$/m).slice(1);
    // Només cal saber quins trets hi surten (per detectar el mode avançat); la numeració és fixa
    blocs.forEach(bloc => {
      const m = bloc.match(/^\d+ = (.+)$/m);
      const r = m && trobarOpcioPerText(m[1]);
      if (r && tret(r.attrId).avancat) avancat = true;
    });
    const mLliure = sp.match(/TRET ADDICIONAL \(sempre actiu[^\n]*\n(.+)/);
    if (mLliure) lliure = mLliure[1].trim();
  } else {
    const perfil = seccio(sp, "=== EL TEU PERFIL ===") || "";
    [...perfil.matchAll(/^- (.+?): (.+)$/gm)].forEach(m => {
      if (m[1] === "Tret addicional") { lliure = m[2].trim(); return; }
      const r = trobarOpcioPerText(m[2]);
      if (r) {
        estat.sel[r.attrId] = r.optId;
        if (tret(r.attrId).avancat) avancat = true;
      }
    });
  }

  $("freeTrait").value = lliure;
  // En les versions antigues, l'E6 només hi era amb el mode avançat
  if (dinamic && avancat) estat.dinSel.genere = ALEATORI;
}

function importarJson(event) {
  const file = event.target.files[0];
  if (!file) return;
  const btn = $("ui_btn_import");
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || (!data._config && !data.system_prompt)) throw new Error("Estructura no reconeguda");
      // Valors per defecte de les opcions noves; la importació els sobreescriu si en té
      estat.dinSel = dinPerDefecte();
      estat.arees = totesLesArees();
      estat.perso = {};
      $("randomIdentity").checked = true;
      $("advancedMode").checked = false;
      if (data._config) importarDesDeConfig(data._config);
      else importarDesDePrompt(data);
      renderitzar();
      feedbackBoto(btn, t().imported, true, () => t().btnImport);
    } catch (err) {
      console.error("Error en importar JSON:", err);
      feedbackBoto(btn, t().importError, false, () => t().btnImport);
    } finally {
      event.target.value = "";
    }
  };
  reader.readAsText(file);
}

/* Els tooltips no poden sortir de la pantalla (sobretot al mòbil): si cal, es desplacen */
function encabirTooltip(cont) {
  const box = cont.querySelector(".tooltip-box");
  if (!box) return;
  box.style.transform = "";
  const r = box.getBoundingClientRect();
  const marge = 12;
  let dx = 0;
  if (r.right > window.innerWidth - marge) dx = window.innerWidth - marge - r.right;
  if (r.left + dx < marge) dx = marge - r.left;
  if (dx) box.style.transform = `translateX(${Math.round(dx)}px)`;
}

function inicialitzarUI() {
  estat.sel = selPerDefecte();
  estat.dinSel = dinPerDefecte();
  estat.arees = totesLesArees();
  carregarTemaPreferit();
  // v0.6.1: el cas comença en blanc; «Cas aleatori» n'omple un d'exemple
  $("infoOberta").value = "";
  $("infoOculta").value = "";
  $("freeTrait").maxLength = TRET_LLIURE.maxCaracters;

  ["assistantName", "companyName", "charName", "charRole", "infoOberta", "infoOculta"].forEach(id => $(id).addEventListener("input", refrescarVistes));
  $("freeTrait").addEventListener("input", () => { actualitzarComptador(); refrescarVistes(); });
  ["lang_cat", "lang_es", "lang_en", "forceLanguages"].forEach(id => $(id).addEventListener("change", () => { actualitzarNotaLlengua(); refrescarVistes(); }));
  ["advancedMode", "dynamicProfile"].forEach(id => $(id).addEventListener("change", canviMode));
  $("meetingClose").addEventListener("change", canviTancament);
  $("evalCode").addEventListener("input", canviCodi);
  $("evalCode").addEventListener("blur", renderCodi);
  ["meetingWarn", "meetingExtra"].forEach(id => $(id).addEventListener("change", canviTancament));
  $("randomIdentity").addEventListener("change", renderitzar);
  document.querySelectorAll(".tooltip-container").forEach(c => {
    c.addEventListener("mouseenter", () => encabirTooltip(c));
    c.addEventListener("focusin", () => encabirTooltip(c));
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { tancarGuiaCas(); tancarEditor(); tancarVisor(); } });

  activarPestanya("projecte");
  aplicarTextosUI();
  actualitzarNotaLlengua();
}

window.addEventListener("DOMContentLoaded", inicialitzarUI);
</script>
</body>
</html>
