<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Clients v3.0</title>
<style>
  :root {
    --bg: #181816;
    --card-bg: #21211e;
    --input-bg: #2b2b27;
    --border: #3b3a35;
    --border-focus: #7a786f;
    --text-primary: #ececec;
    --text-secondary: #9e9c94;
    --accent: #d97757;
    --accent-hover: #e58869;
    --btn-secondary: #32322d;
    --btn-secondary-hover: #3d3d37;
    --pre-bg: #121210;
    --pre-text: #a8c49e;
    --radius: 12px;
    --radius-sm: 8px;
    --success: #a8c49e;
    --error: #e58869;
  }

  body.light-theme {
    --bg: #f6f5f0;
    --card-bg: #ffffff;
    --input-bg: #eeece4;
    --border: #dcd9cd;
    --border-focus: #8e8b80;
    --text-primary: #191816;
    --text-secondary: #6e6b62;
    --accent: #d97757;
    --accent-hover: #c46344;
    --btn-secondary: #e6e3d8;
    --btn-secondary-hover: #dcd8cb;
    --pre-bg: #eeece4;
    --pre-text: #2f6832;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .wrap { width: 100%; max-width: 760px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }

  h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 6px 0; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-secondary); font-size: 0.88rem; margin: 0; }

  .badge {
    background-color: var(--accent);
    color: #fff;
    font-size: 0.7rem;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    vertical-align: middle;
    margin-left: 6px;
  }

  .header-controls { display: flex; align-items: center; gap: 8px; }

  .theme-btn {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    font-size: 0.85rem;
    cursor: pointer;
    height: 31px;
  }
  .theme-btn:hover { background-color: var(--btn-secondary); border-color: var(--border-focus); }

  .lang-selector {
    display: flex;
    gap: 4px;
    background-color: var(--card-bg);
    padding: 3px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .lang-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 4px;
    cursor: pointer;
  }
  .lang-btn.active { background-color: var(--btn-secondary); color: var(--text-primary); }
  .lang-btn:hover:not(.active) { color: var(--text-primary); }

  .top-toolbar { display: flex; justify-content: flex-end; margin-bottom: 16px; }

  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin: 0 0 16px 0;
  }

  label.field {
    display: block;
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin: 14px 0 6px;
  }
  label.field:first-of-type { margin-top: 0; }

  input[type="text"], textarea {
    width: 100%;
    background-color: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 0.88rem;
    font-family: inherit;
  }
  input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--border-focus); }
  textarea { resize: vertical; min-height: 70px; line-height: 1.4; }

  .input-with-button { display: flex; gap: 8px; }
  .input-with-button input { flex: 1; }

  .lang-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 0 6px;
  }
  .lang-header-row label { margin: 0; }
  .lang-default-note { font-size: 0.75rem; color: var(--accent); font-style: italic; }

  .lang-checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .lang-checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    background-color: var(--input-bg);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.85rem;
    user-select: none;
    color: var(--text-primary);
  }
  .lang-checkbox-label:hover { border-color: var(--border-focus); }
  .lang-checkbox-label input { accent-color: var(--accent); cursor: pointer; width: 15px; height: 15px; margin: 0; }

  /* --- Commutadors --- */
  .switch-row { display: flex; align-items: center; gap: 8px; }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--text-primary);
    user-select: none;
  }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: relative;
    width: 34px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 999px;
    background-color: var(--btn-secondary);
    border: 1px solid var(--border);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  .switch .track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background-color: var(--text-secondary);
    transition: transform 0.2s ease, background-color 0.2s ease;
  }
  .switch input:checked + .track { background-color: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(14px); background-color: #fff; }
  .switch input:focus-visible + .track { outline: 2px solid var(--border-focus); outline-offset: 2px; }

  /* --- Ajuda --- */
  .tooltip-container { position: relative; display: inline-flex; align-items: center; }
  .tooltip-icon {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background-color: var(--btn-secondary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 0.72rem;
    font-weight: 700;
    cursor: help;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tooltip-box {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: calc(100% + 8px);
    right: -8px;
    width: 280px;
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    line-height: 1.4;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    z-index: 100;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .tooltip-container:hover .tooltip-box,
  .tooltip-container:focus-within .tooltip-box { visibility: visible; opacity: 1; }

  /* --- Botons --- */
  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 500;
    padding: 9px 14px;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn-sm { padding: 6px 10px; font-size: 0.78rem; }
  .btn-secondary { background-color: var(--btn-secondary); color: var(--text-primary); }
  .btn-secondary:hover { background-color: var(--btn-secondary-hover); border-color: var(--border-focus); }
  .btn-primary {
    background-color: var(--accent);
    color: #fff;
    border: none;
    padding: 12px;
    font-size: 0.95rem;
  }
  .btn-primary:hover { background-color: var(--accent-hover); }

  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
  .btn-group-row { display: flex; gap: 10px; width: 100%; }
  .btn-group-row .btn { flex: 1; }

  pre {
    background-color: var(--pre-bg);
    color: var(--pre-text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    font-size: 0.78rem;
    overflow-x: auto;
    max-height: 300px;
    display: none;
    margin: 4px 0 0;
  }

  /* --- Trets --- */
  .traits-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 8px;
  }
  .mode-switches { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-left: auto; }

  .trait-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 480px;
    grid-template-areas: "name seg" "desc desc";
    column-gap: 16px;
    row-gap: 6px;
    align-items: center;
    padding: 12px 0;
    border-top: 1px solid var(--border);
  }
  .trait-row:first-child { border-top: none; }
  .trait-row.map-row { grid-template-areas: "name seg"; }

  .trait-name { grid-area: name; font-size: 0.9rem; }
  .trait-desc { grid-area: desc; font-size: 0.78rem; color: var(--text-secondary); line-height: 1.4; }

  .seg-grid {
    grid-area: seg;
    display: grid;
    grid-template-columns: repeat(var(--n), minmax(0, 1fr));
    gap: 3px;
    background-color: var(--input-bg);
    padding: 3px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }

  .seg-btn, .map-chip {
    width: 100%;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 0.78rem;
    font-family: inherit;
    padding: 7px 6px;
    border-radius: 5px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .seg-btn { cursor: pointer; transition: background-color 0.15s ease, color 0.15s ease; }
  .seg-btn:hover:not([aria-disabled="true"]):not([aria-pressed="true"]) { color: var(--text-primary); background-color: var(--btn-secondary); }
  .seg-btn[aria-pressed="true"] { background-color: var(--accent); color: #fff; }
  .seg-btn[aria-disabled="true"] { opacity: 0.35; cursor: not-allowed; text-decoration: line-through; }
  .map-chip { white-space: normal; line-height: 1.25; padding: 7px 4px; }
  .map-chip b { color: var(--accent); margin-right: 5px; }

  .free-trait { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .free-head { display: flex; justify-content: space-between; align-items: baseline; }
  .free-head label { margin: 0 0 6px; }
  .counter { font-size: 0.72rem; color: var(--text-secondary); }
  .field-note { margin-top: 6px; font-size: 0.76rem; color: var(--text-secondary); line-height: 1.4; }

  .warning {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--error);
    color: var(--error);
    font-size: 0.8rem;
  }
  .warning.active { display: block; }

  /* --- Mode dinàmic --- */
  .dynamic-panel { display: none; }
  .dynamic-panel.active { display: block; }
  .dynamic-banner {
    background-color: rgba(217, 119, 87, 0.1);
    border: 1px solid var(--accent);
    padding: 12px;
    border-radius: var(--radius-sm);
    margin-top: 12px;
    font-size: 0.82rem;
    line-height: 1.45;
  }
  .map-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin: 16px 0 4px;
  }
  .map-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); font-weight: 600; }

  /* --- Visor de prompt --- */
  .prompt-viewer-box {
    display: none;
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .prompt-viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background-color: var(--input-bg);
    border-bottom: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--text-secondary);
  }
  .zoom-controls { display: flex; gap: 6px; }
  .zoom-btn {
    background-color: var(--btn-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 0.75rem;
    cursor: pointer;
    font-weight: bold;
  }
  .prompt-viewer-text {
    background-color: var(--pre-bg);
    color: var(--text-primary);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    padding: 14px;
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 420px;
    overflow-y: auto;
    font-size: 0.82rem;
    line-height: 1.5;
  }

  .hidden { display: none !important; }

  @media (max-width: 720px) {
    .trait-row, .trait-row.map-row { grid-template-columns: 1fr; grid-template-areas: "name" "seg" "desc"; }
    .seg-btn, .map-chip { white-space: normal; overflow: visible; line-height: 1.2; font-size: 0.74rem; padding: 6px 3px; hyphens: auto; }
    .btn-group-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="ui_title">Generador de Clients</h1>
      <p class="subtitle" id="ui_subtitle"></p>
    </div>
    <div class="header-controls">
      <button class="theme-btn" id="themeToggle" onclick="alternarTema()" title="Mode fosc / clar">☀</button>
      <div class="lang-selector">
        <button class="lang-btn active" onclick="canviarIdiomaUI('cat')" id="btn_lang_cat">CAT</button>
        <button class="lang-btn" onclick="canviarIdiomaUI('es')" id="btn_lang_es">ES</button>
        <button class="lang-btn" onclick="canviarIdiomaUI('en')" id="btn_lang_en">EN</button>
      </div>
    </div>
  </header>

  <div class="top-toolbar">
    <button class="btn btn-secondary" id="ui_btn_import" onclick="document.getElementById('fileInput').click()"></button>
    <input type="file" id="fileInput" accept=".json" class="hidden" onchange="importarJson(event)">
  </div>

  <!-- IDENTIFICACIÓ -->
  <div class="card">
    <div class="card-title" id="ui_sec_id"></div>

    <label class="field" for="assistantName" id="ui_lbl_assistant"></label>
    <input type="text" id="assistantName" value="client_logistica">

    <label class="field" for="charName" id="ui_lbl_charname"></label>
    <div class="input-with-button">
      <input type="text" id="charName" value="Laia Bosch">
      <button class="btn btn-secondary" id="ui_btn_random_name" onclick="generarNomAleatori()"></button>
    </div>

    <label class="field" for="charRole" id="ui_lbl_charrole"></label>
    <input type="text" id="charRole" value="Director/a d'Operacions">

    <div class="lang-header-row">
      <label class="field" id="ui_lbl_agent_langs"></label>
      <span class="lang-default-note" id="ui_lbl_lang_hint"></span>
    </div>
    <div class="lang-checkbox-group">
      <label class="lang-checkbox-label"><input type="checkbox" id="lang_cat"> Català</label>
      <label class="lang-checkbox-label"><input type="checkbox" id="lang_es"> Castellano</label>
      <label class="lang-checkbox-label"><input type="checkbox" id="lang_en"> English</label>
    </div>

    <div class="switch-row" style="margin-top:14px;">
      <label class="switch">
        <input type="checkbox" id="forceLanguages">
        <span class="track"></span>
        <span id="ui_lbl_force_lang"></span>
      </label>
      <div class="tooltip-container">
        <span class="tooltip-icon" tabindex="0">?</span>
        <div class="tooltip-box" id="ui_tt_force_lang"></div>
      </div>
    </div>
  </div>

  <!-- TRETS -->
  <div class="card">
    <div class="card-title" id="ui_sec_traits"></div>

    <div class="traits-toolbar">
      <button class="btn btn-secondary" id="ui_btn_random_traits" onclick="randomitzarTrets()"></button>
      <div class="mode-switches">
        <div class="switch-row">
          <label class="switch">
            <input type="checkbox" id="advancedMode">
            <span class="track"></span>
            <span id="ui_lbl_advanced"></span>
          </label>
          <div class="tooltip-container">
            <span class="tooltip-icon" tabindex="0">?</span>
            <div class="tooltip-box" id="ui_tt_advanced"></div>
          </div>
        </div>
        <div class="switch-row">
          <label class="switch">
            <input type="checkbox" id="dynamicProfile">
            <span class="track"></span>
            <span id="ui_lbl_dynamic"></span>
          </label>
          <div class="tooltip-container">
            <span class="tooltip-icon" tabindex="0">?</span>
            <div class="tooltip-box" id="ui_tt_dynamic"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mode dinàmic: correspondència de números -->
    <div id="dynamicPanel" class="dynamic-panel">
      <div class="dynamic-banner" id="ui_banner_dynamic"></div>
      <div class="map-head">
        <span class="map-title" id="ui_map_title"></span>
        <button class="btn btn-secondary btn-sm" id="ui_btn_shuffle" onclick="barrejarCorrespondencia()"></button>
      </div>
      <div id="mapContainer"></div>
    </div>

    <!-- Mode fix: selectors -->
    <div id="traitsContainer"></div>
    <div id="traitsWarning" class="warning"></div>

    <!-- Mode avançat: tret lliure -->
    <div id="freeTraitBox" class="free-trait">
      <div class="free-head">
        <label class="field" for="freeTrait" id="ui_lbl_free"></label>
        <span class="counter" id="freeCount"></span>
      </div>
      <textarea id="freeTrait" rows="2"></textarea>
      <div class="field-note" id="ui_note_free"></div>
    </div>
  </div>

  <!-- CAS -->
  <div class="card">
    <div class="card-title" id="ui_sec_case"></div>
    <label class="field" for="infoOberta" id="ui_lbl_open"></label>
    <textarea id="infoOberta"></textarea>
    <label class="field" for="infoOculta" id="ui_lbl_hidden"></label>
    <textarea id="infoOculta"></textarea>
  </div>

  <!-- ACCIONS -->
  <div class="actions">
    <button class="btn btn-primary" id="ui_btn_download" onclick="descarregarJson()"></button>
    <div class="btn-group-row">
      <button class="btn btn-secondary" id="ui_btn_copy" onclick="copiarPrompt()"></button>
      <button class="btn btn-secondary" id="ui_btn_view" onclick="alternarVisorPrompt()"></button>
    </div>
    <div id="promptViewerBox" class="prompt-viewer-box">
      <div class="prompt-viewer-header">
        <span id="ui_lbl_viewer_title"></span>
        <div class="zoom-controls">
          <button class="zoom-btn" onclick="canviarZoomPrompt(-0.06)">A−</button>
          <button class="zoom-btn" onclick="canviarZoomPrompt(0.06)">A+</button>
        </div>
      </div>
      <div id="promptViewerText" class="prompt-viewer-text"></div>
    </div>
    <button class="btn btn-secondary" id="ui_btn_preview" onclick="alternarPrevisualitzacio()"></button>
    <pre id="previewJson"></pre>
  </div>
</div>

<!-- =========================================================================
     ███  ZONA EDITABLE: TRETS, PROMPTS I TEXTOS  ███
     Tot el que l'eina escriu al prompt surt d'aquest bloc.
     Es pot modificar sense tocar la lògica (bloc de sota).
     ========================================================================= -->
<script>
const VERSIO = "v3.0";

/* -------------------------------------------------------------------------
   1. TRETS DE PERSONALITAT
   actiu:   false → el tret no surt enlloc (reservat per al futur).
   avancat: true  → només surt amb el Mode avançat activat.
   promptLabel: com apareix el tret dins del prompt.
   notaPrompt:  instrucció extra que acompanya el tret al prompt (opcional).
   Per a cada opció:
     nom        → text del botó (cat / es / en)
     descripcio → frase curta sota el tret a la interfície
     prompt     → text que S'INJECTA al prompt (2a persona)
     conducta   → "Conducta a detectar" (desat, encara NO s'injecta)
     feedback   → "Explicació per al feedback" (desat, encara NO s'injecta)
   ------------------------------------------------------------------------- */
const ATRIBUTS = [

  /* ===== EXPERIÈNCIA ===== */
  {
    id: "experiencia",
    actiu: true,
    avancat: false,
    nom: { cat: "Experiència", es: "Experiencia", en: "Experience" },
    promptLabel: "Experiència",
    defecte: "intermedia",
    opcions: [
      {
        id: "inicial",
        nom: { cat: "Inicial", es: "Inicial", en: "Early" },
        descripcio: {
          cat: "Poca antiguitat; consulta els superiors abans de comprometre's.",
          es: "Poca antigüedad; consulta a sus superiores antes de comprometerse.",
          en: "Little seniority; checks with superiors before committing."
        },
        prompt: "Fa poc temps que ets a l'organització, vols causar bona impressió i sovint consultes els teus superiors.",
        conducta: "Evita assumir compromisos, fa referència als superiors o demana consultar-ho abans de prendre determinades decisions.",
        feedback: "Aquest comportament és coherent amb un perfil amb poca experiència a l'organització, que encara depèn de nivells superiors per a determinades decisions. Per gestionar aquest perfil, convé identificar quines qüestions pot decidir directament i quines requereixen validació, evitant pressionar-lo perquè assumeixi decisions que no li corresponen."
      },
      {
        id: "intermedia",
        nom: { cat: "Intermèdia", es: "Intermedia", en: "Mid-level" },

- Enfocament de negoci: traducció de les solucions tècniques a reducció de riscos, estalvi de costos, eficiència operativa i retorn de la inversió.
- Gestió de la incertesa: validació dels supòsits, petició d'aclariments i detecció d'ambigüitats.
- Identificació d'stakeholders i context: preguntes sobre altres departaments afectats (Direcció, PRL, usuaris finals, Finances) i sobre sistemes o processos existents.
- Professionalitat comunicativa: to professional, vocabulari clar sense tecnicismes innecessaris i bona interacció amb el client.

Penalitzacions (resten punts):
- Assumir dades o requisits sense validar-los amb el client.
- Ometre o minimitzar la seguretat, el risc laboral o el compliment normatiu.
- No indagar en restriccions d'abast, riscos, manteniment o operació futura.
- Fer servir un llenguatge purament tècnic sense connectar-lo amb l'impacte real en l'organització.

Després de l'informe:
Només si en aquesta conversa ja has emès l'informe, a qualsevol missatge posterior respon únicament «Avaluació finalitzada. Simulació tancada.». No tornis a fer de client ni responguis dubtes sobre el cas.

<!-- =========================================================================
     LÒGICA DE L'EINA (no cal tocar-la per canviar textos ni prompts)
     ========================================================================= -->
<script>
let currentLang = "cat";
let promptFontSize = 0.82;
const estat = { sel: {}, mapa: {} };

/* ===== Utilitats ===== */
const $ = id => document.getElementById(id);
const t = () => UI_LANGS[currentLang];
const esDinamic = () => $("dynamicProfile").checked;
const esAvancat = () => $("advancedMode").checked;
const tret = id => ATRIBUTS.find(a => a.id === id);
const opcio = (attrId, optId) => { const a = tret(attrId); return a ? a.opcions.find(o => o.id === optId) : undefined; };

/* Trets que es mostren i s'injecten segons el mode */
function tretsVisibles() {
  return ATRIBUTS.filter(a => a.actiu && (!a.avancat || esAvancat()));
}

/* Substitució en un sol pas (el text de l'usuari no es torna a processar) */
function omplir(plantilla, valors) {
  return plantilla.replace(/\{(\w+)\}/g, (m, k) => (k in valors ? String(valors[k]) : m));
}

/* Atzar criptogràfic quan està disponible */
function rnd(n) {
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] % n;
  }
  return Math.floor(Math.random() * n);
}

function barrejar(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function nomAleatori() {
  return `${NOMS_POOL.prenoms[rnd(NOMS_POOL.prenoms.length)]} ${NOMS_POOL.cognoms[rnd(NOMS_POOL.cognoms.length)]}`;
}

function textNet(s) { return (s || "").replace(/\s+/g, " ").trim(); }

/* ===== Selecció i regles ===== */
function selPerDefecte() {
  const s = {};
  ATRIBUTS.forEach(a => { s[a.id] = a.defecte; });
  return s;
}

function normalitzarSel(s) {
  const out = selPerDefecte();
  if (s && typeof s === "object") {
    ATRIBUTS.forEach(a => { if (opcio(a.id, s[a.id])) out[a.id] = s[a.id]; });
  }
  return out;
}

/* Una regla s'aplica només si tots els seus trets són visibles */
function reglesAplicables() {
  const ids = tretsVisibles().map(a => a.id);
  return REGLES.filter(r => Object.keys(r.cond).every(k => ids.includes(k)));
}

function reglaViolada(sel, attrId) {
  return reglesAplicables().find(r =>
    (!attrId || attrId in r.cond) &&
    Object.entries(r.cond).every(([a, v]) => sel[a] === v)
  ) || null;
}

function selAleatoria() {
  for (let i = 0; i < 500; i++) {
    const s = { ...estat.sel };
    tretsVisibles().forEach(a => { s[a.id] = a.opcions[rnd(a.opcions.length)].id; });
    if (!reglaViolada(s)) return s;
  }
  return selPerDefecte();
}

/* ===== Correspondència de números (mode dinàmic) ===== */
function generarMapa() {
  const m = {};
  ATRIBUTS.forEach(a => { m[a.id] = barrejar(a.opcions.map(o => o.id)); });
  estat.mapa = m;
}

function mapaValid(m) {
  if (!m || typeof m !== "object") return false;
  return ATRIBUTS.every(a => {
    const ids = a.opcions.map(o => o.id);
    return Array.isArray(m[a.id]) && m[a.id].length === ids.length && ids.every(id => m[a.id].includes(id));
  });
}

/* ===== Tema ===== */
function alternarTema() {
  const clar = document.body.classList.toggle("light-theme");
  $("themeToggle").textContent = clar ? "🌙" : "☀";
  try { localStorage.setItem("theme_preference", clar ? "light" : "dark"); } catch (e) {}
}

function carregarTemaPreferit() {
  let guardat = null;
  try { guardat = localStorage.getItem("theme_preference"); } catch (e) {}
  const clar = guardat === "light";
  document.body.classList.toggle("light-theme", clar);
  $("themeToggle").textContent = clar ? "🌙" : "☀";
}

/* ===== Interfície ===== */
function canviarIdiomaUI(lang) {
  currentLang = lang;
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.id === `btn_lang_${lang}`));
  document.documentElement.lang = lang === "cat" ? "ca" : lang;
  aplicarTextosUI();
}

function aplicarTextosUI() {
  const x = t();
  const textos = {
    ui_subtitle: x.subtitle, ui_sec_id: x.secId, ui_lbl_assistant: x.lblAssistant,
    ui_lbl_charname: x.lblCharName, ui_btn_random_name: x.btnRandomName, ui_lbl_charrole: x.lblCharRole,
    ui_lbl_agent_langs: x.lblAgentLangs, ui_lbl_lang_hint: x.lblLangHint, ui_lbl_force_lang: x.lblForceLang,
    ui_tt_force_lang: x.ttForceLang, ui_sec_traits: x.secTraits, ui_btn_random_traits: x.btnRandomTraits,
    ui_lbl_advanced: x.lblAdvanced, ui_tt_advanced: x.ttAdvanced, ui_lbl_dynamic: x.lblDynamic,
    ui_tt_dynamic: x.ttDynamic, ui_map_title: x.mapTitle, ui_btn_shuffle: x.btnShuffle,
    ui_lbl_free: x.lblFree, ui_note_free: x.noteFree, ui_sec_case: x.secCase, ui_lbl_open: x.lblOpen,
    ui_lbl_hidden: x.lblHidden, ui_btn_download: x.btnDownload, ui_btn_import: x.btnImport,
    ui_btn_copy: x.btnCopy, ui_lbl_viewer_title: x.lblViewerTitle, ui_btn_preview: x.btnPreview
  };
  for (const id in textos) $(id).textContent = textos[id];
  $("ui_title").innerHTML = `${x.title} <span class="badge">${VERSIO}</span>`;
  $("ui_banner_dynamic").innerHTML = x.bannerDynamic;
  $("ui_btn_view").textContent = $("promptViewerBox").style.display === "block" ? x.btnHideView : x.btnView;
  renderitzar();
}

function renderitzar() {
  const din = esDinamic();
  const adv = esAvancat();

  $("dynamicPanel").classList.toggle("active", din);
  $("traitsContainer").classList.toggle("hidden", din);
  $("ui_btn_random_traits").classList.toggle("hidden", din);
  $("freeTraitBox").classList.toggle("hidden", !adv);

  if (din) renderMapa(); else renderTrets();
  renderAvis();
  actualitzarComptador();
  refrescarVistes();
}

function crearFila(at, extraClass) {
  const row = document.createElement("div");
  row.className = "trait-row" + (extraClass ? " " + extraClass : "");
  const nom = document.createElement("div");
  nom.className = "trait-name";
  nom.textContent = at.nom[currentLang];
  const grid = document.createElement("div");
  grid.className = "seg-grid";
  grid.style.setProperty("--n", at.opcions.length);
  row.appendChild(nom);
  row.appendChild(grid);
  return { row, grid };
}

function renderTrets() {
  const cont = $("traitsContainer");
  cont.innerHTML = "";

  tretsVisibles().forEach(at => {
    const { row, grid } = crearFila(at);
    grid.setAttribute("role", "group");
    grid.setAttribute("aria-label", at.nom[currentLang]);

    at.opcions.forEach(o => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "seg-btn";
      b.textContent = o.nom[currentLang];
      const actiu = estat.sel[at.id] === o.id;
      b.setAttribute("aria-pressed", actiu ? "true" : "false");

      const regla = actiu ? null : reglaViolada({ ...estat.sel, [at.id]: o.id }, at.id);
      if (regla) {
        b.setAttribute("aria-disabled", "true");
        b.title = t().ttIncompat + regla.motiu[currentLang];
      } else {
        b.title = o.descripcio[currentLang];
      }

      b.addEventListener("click", () => {
        if (b.getAttribute("aria-disabled") === "true") return;
        estat.sel[at.id] = o.id;
        renderitzar();
      });
      grid.appendChild(b);
    });

    const desc = document.createElement("div");
    desc.className = "trait-desc";
    const triada = opcio(at.id, estat.sel[at.id]);
    desc.textContent = triada ? triada.descripcio[currentLang] : "";
    row.appendChild(desc);
    cont.appendChild(row);
  });
}

function renderMapa() {
  const cont = $("mapContainer");
  cont.innerHTML = "";
  tretsVisibles().forEach(at => {
    const { row, grid } = crearFila(at, "map-row");
    estat.mapa[at.id].forEach((optId, i) => {
      const chip = document.createElement("div");
      chip.className = "map-chip";
      const num = document.createElement("b");
      num.textContent = i + 1;
      chip.appendChild(num);
      chip.appendChild(document.createTextNode(opcio(at.id, optId).nom[currentLang]));
      chip.title = opcio(at.id, optId).descripcio[currentLang];
      grid.appendChild(chip);
    });
    cont.appendChild(row);
  });
}

function renderAvis() {
  const w = $("traitsWarning");
  const r = !esDinamic() ? reglaViolada(estat.sel) : null;
  w.textContent = r ? `${t().warnIncompat} ${r.motiu[currentLang]}` : "";
  w.classList.toggle("active", !!r);
}

function actualitzarComptador() {
  $("freeCount").textContent = `${$("freeTrait").value.length}/${TRET_LLIURE.maxCaracters}`;
}

function actualitzarNotaLlengua() {
  const cap = !$("lang_cat").checked && !$("lang_es").checked && !$("lang_en").checked;
  $("ui_lbl_lang_hint").style.visibility = cap ? "visible" : "hidden";
}

function generarNomAleatori() {
  $("charName").value = nomAleatori();
  refrescarVistes();
}

function randomitzarTrets() {
  if (esDinamic()) return;
  estat.sel = selAleatoria();
  renderitzar();
}

function barrejarCorrespondencia() {
  generarMapa();
  renderitzar();
}

/* Si en canviar de mode la selecció actual queda incompatible, se'n tria una de vàlida */
function canviMode() {
  if (reglaViolada(estat.sel)) estat.sel = selAleatoria();
  renderitzar();
}

function refrescarVistes() {
  if ($("promptViewerBox").style.display === "block") $("promptViewerText").textContent = compilarSystemPrompt();
  if ($("previewJson").style.display === "block") $("previewJson").textContent = JSON.stringify(generarEstructuraJSON(), null, 2);
}

function canviarZoomPrompt(delta) {
  promptFontSize = Math.min(Math.max(promptFontSize + delta, 0.65), 1.35);
  $("promptViewerText").style.fontSize = `${promptFontSize}rem`;
}

function alternarVisorPrompt() {
  const box = $("promptViewerBox");
  const obrir = box.style.display !== "block";
  box.style.display = obrir ? "block" : "none";
  $("ui_btn_view").textContent = obrir ? t().btnHideView : t().btnView;
  if (obrir) {
    $("promptViewerText").textContent = compilarSystemPrompt();
    $("promptViewerText").style.fontSize = `${promptFontSize}rem`;
  }
}

function alternarPrevisualitzacio() {
  const pre = $("previewJson");
  const obrir = pre.style.display !== "block";
  pre.style.display = obrir ? "block" : "none";
  if (obrir) pre.textContent = JSON.stringify(generarEstructuraJSON(), null, 2);
}

/* ===== Compilació del prompt ===== */
function idiomesSeleccionats() {
  const s = [];
  if ($("lang_cat").checked) s.push({ id: "cat", nom: "CATALÀ" });
  if ($("lang_es").checked) s.push({ id: "es", nom: "CASTELLÀ" });
  if ($("lang_en").checked) s.push({ id: "en", nom: "ANGLÈS" });
  return s;
}

function compilarIdioma() {
  const sel = idiomesSeleccionats();
  if (sel.length === 0) sel.push({ id: "cat", nom: "CATALÀ" });
  const inici = sel[0].nom;
  const llista = sel.map(l => l.nom).join(", ");

  if ($("forceLanguages").checked) {
    return `Gestió estricta:
1. Comença la reunió en ${inici}.
2. Com a client, només entens i parles aquests idiomes: [${llista}].
3. Si l'usuari et parla o et demana parlar en un idioma de la llista, canvia-hi immediatament i mantén-lo fins que l'usuari en triï un altre de la llista. El teu caràcter i el teu to s'han de mantenir amb naturalitat en l'idioma en curs.
4. Si l'usuari fa servir un idioma que no és a la llista, no canviïs d'idioma: respon en l'últim idioma permès i deixa clar que a l'empresa només us comuniqueu en [${llista}].`;
  }
  return `Gestió flexible:
1. Comença la conversa en ${inici} (idiomes habituals de l'empresa: [${llista}]).
2. Si l'usuari et parla en un altre idioma, adapta't a la seva llengua amb naturalitat i mantén-la fins que l'usuari en proposi una altra.`;
}

function tretLliureActiu() {
  return esAvancat() ? textNet($("freeTrait").value).slice(0, TRET_LLIURE.maxCaracters) : "";
}

function seccioPerfilFix() {
  const linies = tretsVisibles().map(a => {
    const o = opcio(a.id, estat.sel[a.id]);
    let l = `- ${a.promptLabel}: ${o.prompt}`;
    if (a.notaPrompt && o.id !== a.defecte) l += `\n  Nota: ${a.notaPrompt}`;
    return l;
  }).join("\n");
  const lliure = tretLliureActiu();
  return omplir(SECCIO_PERFIL_FIX, {
    trets: linies,
    tretLliure: lliure ? `\n- Tret addicional: ${lliure}` : ""
  });
}

function seccioPerfilDinamic() {
  const eixos = tretsVisibles();
  const index = {};
  eixos.forEach((a, i) => { index[a.id] = i + 1; });

  const rangs = eixos.map((a, i) => `- Eix ${i + 1}: un número de l'1 al ${a.opcions.length}`).join("\n");

  const regles = reglesAplicables().map(r => {
    const parts = Object.entries(r.cond).map(([a, v]) => ({ eix: index[a], num: estat.mapa[a].indexOf(v) + 1 }));
    const ultim = parts[parts.length - 1];
    return `- No es permet ${parts.map(p => `eix ${p.eix} = ${p.num}`).join(" juntament amb ")}. Si et surt, torna a triar el número de l'eix ${ultim.eix}.`;
  });

  const taula = eixos.map((a, i) => {
    let bloc = `EIX ${i + 1} — ${a.promptLabel.toUpperCase()}`;
    if (a.notaPrompt) bloc += `\nNota: ${a.notaPrompt}`;
    bloc += "\n" + estat.mapa[a.id].map((optId, k) => `${k + 1} = ${opcio(a.id, optId).prompt}`).join("\n");
    return bloc;
  }).join("\n\n");

  const lliure = tretLliureActiu();
  return omplir(SECCIO_PERFIL_DINAMIC, {
    nEixos: eixos.length,
    rangs,
    regles: regles.length ? `\nCombinacions no permeses:\n${regles.join("\n")}` : "",
    format: eixos.map((a, i) => `n${i + 1}`).join("-"),
    taula,
    tretLliure: lliure ? `\n\nTRET ADDICIONAL (sempre actiu, sigui quin sigui el perfil):\n${lliure}` : ""
  });
}

function compilarSystemPrompt() {
  return omplir(PLANTILLA_PROMPT, {
    idioma: compilarIdioma(),
    nom: textNet($("charName").value),
    carrec: textNet($("charRole").value),
    infoOberta: $("infoOberta").value.trim(),
    infoOculta: $("infoOculta").value.trim(),
    perfil: esDinamic() ? seccioPerfilDinamic() : seccioPerfilFix()
  });
}

/* ===== Exportació ===== */
function generarEstructuraJSON() {
  const nomAssistent = textNet($("assistantName").value) || "client";
  const nom = textNet($("charName").value);
  const din = esDinamic();

  const callbackConfig = JSON.stringify({
    prompt_processor: "simple_augment",
    connector: "openai",
    rag_processor: "no_rag",
    file_path: "",
    capabilities: { vision: true, image_generation: false }
  });

  return {
    name: nomAssistent,
    description: `Client simulat: ${nom}${din ? " (perfil dinàmic)" : ""}`,
    api_callback: callbackConfig,
    system_prompt: compilarSystemPrompt(),
    prompt_template: "Ets un client d'una empresa. Aquí tens el context complet.\n --- {context} --- \n\nAra respon la pregunta de l'usuari: --- {user_input} ---\n",
    RAG_endpoint: "",
    RAG_Top_k: 3,
    RAG_collections: "",
    pre_retrieval_endpoint: "",
    post_retrieval_endpoint: "",
    published: false,
    metadata: callbackConfig,
    _config: {
      versio: VERSIO,
      assistantName: nomAssistent,
      charName: nom,
      charRole: textNet($("charRole").value),
      agentLangs: idiomesSeleccionats().map(l => l.id),
      forceLanguages: $("forceLanguages").checked,
      advancedMode: esAvancat(),
      dynamicProfile: din,
      trets: { ...estat.sel },
      tretLliure: textNet($("freeTrait").value),
      mapa: estat.mapa,
      infoOberta: $("infoOberta").value,
      infoOculta: $("infoOculta").value
    }
  };
}

function descarregarJson() {
  const dades = generarEstructuraJSON();
  const blob = new Blob([JSON.stringify(dades, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `${dades.name}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

function feedbackBoto(btn, text, ok, original) {
  btn.textContent = text;
  btn.style.borderColor = ok ? "var(--success)" : "var(--error)";
  btn.style.color = ok ? "var(--success)" : "var(--error)";
  setTimeout(() => {
    btn.textContent = original();
    btn.style.borderColor = "";
    btn.style.color = "";
  }, 2200);
}

function copiarPrompt() {
  const text = compilarSystemPrompt();
  const btn = $("ui_btn_copy");
  const exit = () => feedbackBoto(btn, t().copied, true, () => t().btnCopy);
  const error = () => feedbackBoto(btn, t().copyError, false, () => t().btnCopy);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(exit).catch(() => copiaAlternativa(text, exit, error));
  } else {
    copiaAlternativa(text, exit, error);
  }
}

function copiaAlternativa(text, exit, error) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-999999px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    ok ? exit() : error();
  } catch (e) {
    error();
  }
}

/* ===== Importació ===== */
function aplicarIdiomes(llista) {
  $("lang_cat").checked = llista.includes("cat");
  $("lang_es").checked = llista.includes("es");
  $("lang_en").checked = llista.includes("en");
  actualitzarNotaLlengua();
}

/* Busca a quin tret i opció correspon un text de prompt */
function trobarOpcioPerText(text) {
  for (const a of ATRIBUTS) {
    const o = a.opcions.find(op => text.includes(op.prompt));
    if (o) return { attrId: a.id, optId: o.id };
  }
  return null;
}

function seccio(sp, capcalera) {
  const i = sp.indexOf(capcalera);
  if (i === -1) return null;
  const inici = i + capcalera.length;
  const fi = sp.indexOf("\n=== ", inici);
  return sp.slice(inici, fi === -1 ? sp.length : fi).trim();
}

function importarDesDeConfig(c) {
  if (c.assistantName) $("assistantName").value = c.assistantName;
  if (c.charName) $("charName").value = c.charName;
  if (c.charRole) $("charRole").value = c.charRole;
  if (Array.isArray(c.agentLangs)) aplicarIdiomes(c.agentLangs);
  else if (c.agentLang) aplicarIdiomes([c.agentLang]);
  if (c.forceLanguages !== undefined) $("forceLanguages").checked = !!c.forceLanguages;
  if (c.infoOberta !== undefined) $("infoOberta").value = c.infoOberta;
  if (c.infoOculta !== undefined) $("infoOculta").value = c.infoOculta;

  // Trets de versions anteriors amb ids diferents s'ignoren (queden els valors per defecte)
  estat.sel = normalitzarSel(c.trets);
  $("freeTrait").value = typeof c.tretLliure === "string" ? c.tretLliure.slice(0, TRET_LLIURE.maxCaracters) : "";
  $("advancedMode").checked = !!c.advancedMode || !!(c.tretLliure && c.tretLliure.trim());
  $("dynamicProfile").checked = !!c.dynamicProfile;
  if (mapaValid(c.mapa)) estat.mapa = c.mapa; else generarMapa();
}

function importarDesDePrompt(data) {
  if (data.name) $("assistantName").value = data.name;
  const sp = data.system_prompt || "";

  const mRol = sp.match(/^Ets\s+([^,\n]+),\s+(.+?)\s+de l'empresa\./m);
  if (mRol) {
    $("charName").value = mRol[1].trim();
    $("charRole").value = mRol[2].trim();
  } else if (data.description) {
    const m = data.description.match(/(?:Client|Stakeholder) simulat:\s*(.+?)(?:\s*\(perfil dinàmic\))?$/i);
    if (m) $("charName").value = m[1].trim();
  }

  const context = seccio(sp, "=== CONTEXT DE L'EMPRESA ===") ?? (sp.match(/CONTEXT GENERAL DE L'EMPRESA:\s*\n([\s\S]*?)\n\s*(?:PERFIL|INFORMACIÓ RESERVADA)/) || [])[1];
  if (context) $("infoOberta").value = context.trim();

  let reservada = seccio(sp, "=== INFORMACIÓ RESERVADA ===");
  if (reservada) reservada = reservada.replace(/^Aquesta informació només la reveles[^\n]*\n/, "");
  else reservada = (sp.match(/INFORMACIÓ RESERVADA I CUSTODIADA:\s*\n([\s\S]*?)\n\s*DIRECTRIUS DE COMPORTAMENT/) || [])[1];
  if (reservada) $("infoOculta").value = reservada.trim();

  $("forceLanguages").checked = sp.includes("Gestió estricta") || sp.includes("GESTIÓ LINGÜÍSTICA ESTRICTA");
  aplicarIdiomes(["cat", "es", "en"].filter((id, i) => sp.includes(["CATALÀ", "CASTELLÀ", "ANGLÈS"][i])));

  estat.sel = selPerDefecte();
  generarMapa();
  let avancat = false;
  let lliure = "";

  const dinamic = sp.includes("=== EL TEU PERFIL (ES DEFINEIX AL PRIMER MISSATGE) ===");
  $("dynamicProfile").checked = dinamic;

  if (dinamic) {
    const blocs = sp.split(/^EIX \d+ — .+$/m).slice(1);
    blocs.forEach(bloc => {
      const linies = [...bloc.matchAll(/^(\d+) = (.+)$/gm)];
      let attrId = null;
      const ordre = [];
      linies.forEach(m => {
        const r = trobarOpcioPerText(m[2]);
        if (r) { attrId = r.attrId; ordre[Number(m[1]) - 1] = r.optId; }
      });
      if (attrId && ordre.filter(Boolean).length === tret(attrId).opcions.length) {
        estat.mapa[attrId] = ordre;
        if (tret(attrId).avancat) avancat = true;
      }
    });
    const mLliure = sp.match(/TRET ADDICIONAL \(sempre actiu[^\n]*\n(.+)/);
    if (mLliure) lliure = mLliure[1].trim();
  } else {
    const perfil = seccio(sp, "=== EL TEU PERFIL ===") || "";
    [...perfil.matchAll(/^- (.+?): (.+)$/gm)].forEach(m => {
      if (m[1] === "Tret addicional") { lliure = m[2].trim(); return; }
      const r = trobarOpcioPerText(m[2]);
      if (r) {
        estat.sel[r.attrId] = r.optId;
        if (tret(r.attrId).avancat) avancat = true;
      }
    });
  }

  $("freeTrait").value = lliure;
  $("advancedMode").checked = avancat || !!lliure;
}

function importarJson(event) {
  const file = event.target.files[0];
  if (!file) return;
  const btn = $("ui_btn_import");
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || (!data._config && !data.system_prompt)) throw new Error("Estructura no reconeguda");
      if (data._config) importarDesDeConfig(data._config);
      else importarDesDePrompt(data);
      renderitzar();
      feedbackBoto(btn, t().imported, true, () => t().btnImport);
    } catch (err) {
      console.error("Error en importar JSON:", err);
      feedbackBoto(btn, t().importError, false, () => t().btnImport);
    } finally {
      event.target.value = "";
    }
  };
  reader.readAsText(file);
}

/* ===== Inici ===== */
function inicialitzarUI() {
  estat.sel = selPerDefecte();
  generarMapa();
  carregarTemaPreferit();
  $("infoOberta").value = CAS_PER_DEFECTE.infoOberta;
  $("infoOculta").value = CAS_PER_DEFECTE.infoOculta;
  $("freeTrait").maxLength = TRET_LLIURE.maxCaracters;

  ["assistantName", "charName", "charRole", "infoOberta", "infoOculta"].forEach(id => $(id).addEventListener("input", refrescarVistes));
  $("freeTrait").addEventListener("input", () => { actualitzarComptador(); refrescarVistes(); });
  ["lang_cat", "lang_es", "lang_en", "forceLanguages"].forEach(id => $(id).addEventListener("change", () => { actualitzarNotaLlengua(); refrescarVistes(); }));
  ["advancedMode", "dynamicProfile"].forEach(id => $(id).addEventListener("change", canviMode));

  aplicarTextosUI();
  actualitzarNotaLlengua();
}

window.addEventListener("DOMContentLoaded", inicialitzarUI);
</script>
