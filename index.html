<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Clients v0.5.1</title>
<style>
  :root {
    --bg: #181816;
    --card-bg: #21211e;
    --input-bg: #2b2b27;
    --border: #3b3a35;
    --border-focus: #7a786f;
    --text-primary: #ececec;
    --text-secondary: #9e9c94;
    --accent: #d97757;
    --accent-hover: #e58869;
    --btn-secondary: #32322d;
    --btn-secondary-hover: #3d3d37;
    --pre-bg: #121210;
    --pre-text: #a8c49e;
    --radius: 12px;
    --radius-sm: 8px;
    --success: #a8c49e;
    --error: #e58869;
  }

  body.light-theme {
    --bg: #f6f5f0;
    --card-bg: #ffffff;
    --input-bg: #eeece4;
    --border: #dcd9cd;
    --border-focus: #8e8b80;
    --text-primary: #191816;
    --text-secondary: #6e6b62;
    --accent: #d97757;
    --accent-hover: #c46344;
    --btn-secondary: #e6e3d8;
    --btn-secondary-hover: #dcd8cb;
    --pre-bg: #eeece4;
    --pre-text: #2f6832;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .wrap { width: 100%; max-width: 760px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }

  h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 6px 0; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-secondary); font-size: 0.88rem; margin: 0; }

  .badge {
    background-color: var(--accent);
    color: #fff;
    font-size: 0.7rem;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    vertical-align: middle;
    margin-left: 6px;
  }

  .header-controls { display: flex; align-items: center; gap: 8px; }

  .theme-btn {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    padding: 0;
    cursor: pointer;
    width: 31px;
    height: 31px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .theme-btn svg { width: 16px; height: 16px; display: block; }
  .theme-btn .icon-moon { display: none; }
  body.light-theme .theme-btn .icon-sun { display: none; }
  body.light-theme .theme-btn .icon-moon { display: block; }
  .theme-btn:hover { background-color: var(--btn-secondary); border-color: var(--border-focus); }

  .lang-selector {
    display: flex;
    gap: 4px;
    background-color: var(--card-bg);
    padding: 3px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .lang-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 4px;
    cursor: pointer;
  }
  .lang-btn.active { background-color: var(--btn-secondary); color: var(--text-primary); }
  .lang-btn:hover:not(.active) { color: var(--text-primary); }

  .top-toolbar { display: flex; justify-content: flex-end; margin-bottom: 16px; }

  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin: 0 0 16px 0;
  }

  label.field {
    display: block;
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin: 14px 0 6px;
  }
  label.field:first-of-type { margin-top: 0; }

  input[type="text"], textarea {
    width: 100%;
    background-color: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 0.88rem;
    font-family: inherit;
  }
  input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--border-focus); }
  textarea { resize: vertical; min-height: 70px; line-height: 1.4; }

  .input-with-button { display: flex; gap: 8px; }
  .input-with-button input { flex: 1; }

  .lang-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 0 6px;
  }
  .lang-header-row label { margin: 0; }
  .lang-default-note { font-size: 0.75rem; color: var(--text-secondary); font-style: italic; }

  .lang-checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .lang-checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    background-color: var(--input-bg);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.85rem;
    user-select: none;
    color: var(--text-primary);
  }
  .lang-checkbox-label:hover { border-color: var(--border-focus); }
  .lang-checkbox-label input { accent-color: var(--accent); cursor: pointer; width: 15px; height: 15px; margin: 0; }

  /* --- Commutadors --- */
  .switch-row { display: flex; align-items: center; gap: 8px; }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--text-primary);
    user-select: none;
  }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: relative;
    width: 34px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 999px;
    background-color: var(--btn-secondary);
    border: 1px solid var(--border);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  .switch .track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background-color: var(--text-secondary);
    transition: transform 0.2s ease, background-color 0.2s ease;
  }
  .switch input:checked + .track { background-color: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(14px); background-color: #fff; }
  .switch input:focus-visible + .track { outline: 2px solid var(--border-focus); outline-offset: 2px; }

  /* --- Ajuda --- */
  .tooltip-container { position: relative; display: inline-flex; align-items: center; }
  .tooltip-icon {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background-color: var(--btn-secondary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 0.72rem;
    font-weight: 700;
    cursor: help;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tooltip-box {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: calc(100% + 8px);
    right: -8px;
    width: 280px;
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    line-height: 1.4;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    z-index: 100;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .tooltip-container:hover .tooltip-box,
  .tooltip-container:focus-within .tooltip-box { visibility: visible; opacity: 1; }

  /* --- Botons --- */
  .btn {
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 500;
    padding: 9px 14px;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn-sm { padding: 6px 10px; font-size: 0.78rem; }
  .btn-secondary { background-color: var(--btn-secondary); color: var(--text-primary); }
  .btn-secondary:hover { background-color: var(--btn-secondary-hover); border-color: var(--border-focus); }
  .btn-primary {
    background-color: var(--accent);
    color: #fff;
    border: none;
    padding: 12px;
    font-size: 0.95rem;
  }
  .btn-primary:hover { background-color: var(--accent-hover); }

  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
  .btn-group-row { display: flex; gap: 10px; width: 100%; }
  .btn-group-row .btn { flex: 1; }

  pre {
    background-color: var(--pre-bg);
    color: var(--pre-text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    font-size: 0.78rem;
    overflow-x: auto;
    max-height: 300px;
    display: none;
    margin: 4px 0 0;
  }

  /* --- Trets --- */
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-bottom: 16px;
  }
  .card-head .card-title { margin: 0; }
  .case-random-btn { margin-left: auto; padding: 6px 12px; font-size: 0.8rem; }
  .traits-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0 8px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .mode-switches { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-left: auto; }

  /* --- Blocs plegables (transició suau en canviar de mode) --- */
  .collapsible {
    display: grid;
    grid-template-rows: 1fr;
    opacity: 1;
    transition: grid-template-rows 0.34s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.26s ease;
  }
  .collapsible.collapsed { grid-template-rows: 0fr; opacity: 0; pointer-events: none; }
  .collapsible-inner { overflow: hidden; min-height: 0; }
  .collapsible.collapsed .collapsible-inner { visibility: hidden; transition: visibility 0s linear 0.34s; }

  .trait-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 480px;
    grid-template-areas: "name seg" "desc desc";
    column-gap: 16px;
    row-gap: 6px;
    align-items: center;
    padding: 12px 0;
    border-top: 1px solid var(--border);
  }
  .trait-row:first-child { border-top: none; }

  .trait-name { grid-area: name; font-size: 0.9rem; }
  .trait-desc { grid-area: desc; font-size: 0.78rem; color: var(--text-secondary); line-height: 1.4; }

  .seg-grid {
    grid-area: seg;
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--n), minmax(0, 1fr));
    gap: 3px;
    background-color: var(--input-bg);
    padding: 3px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }

  .seg-btn {
    position: relative;
    z-index: 1;
    width: 100%;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 0.78rem;
    font-family: inherit;
    padding: 7px 6px;
    border-radius: 5px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .seg-btn { cursor: pointer; transition: background-color 0.18s ease, color 0.22s ease; }
  .seg-btn:hover:not([aria-disabled="true"]):not([aria-pressed="true"]) { color: var(--text-primary); background-color: var(--btn-secondary); }
  .seg-btn[aria-pressed="true"] { color: #fff; }
  .seg-btn:focus-visible { outline: 2px solid var(--border-focus); outline-offset: -2px; }

  /* Indicador taronja que llisca fins a l'opció triada */
  .seg-indicator {
    position: absolute;
    z-index: 0;
    top: 3px;
    bottom: 3px;
    left: 3px;
    width: calc((100% - 6px - (var(--n) - 1) * 3px) / var(--n));
    border-radius: 5px;
    background-color: var(--accent);
    box-shadow: 0 2px 8px rgba(217, 119, 87, 0.35);
    transform: translateX(calc(var(--i, 0) * (100% + 3px)));
    transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  .seg-grid.no-anim .seg-indicator { transition: none; }
  .trait-desc { transition: opacity 0.18s ease; }
  .trait-desc.fade { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .seg-indicator, .collapsible, .collapsible-inner, .trait-desc, .seg-btn { transition: none !important; }
  }
  .seg-btn[aria-disabled="true"] { opacity: 0.35; cursor: not-allowed; text-decoration: line-through; }

  .free-trait { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .free-head { display: flex; justify-content: space-between; align-items: baseline; }
  .free-head label { margin: 0 0 6px; }
  .counter { font-size: 0.72rem; color: var(--text-secondary); }
  .field-note { margin-top: 6px; font-size: 0.76rem; color: var(--text-secondary); line-height: 1.4; }

  .warning {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--error);
    color: var(--error);
    font-size: 0.8rem;
  }
  .warning.active { display: block; }

  /* --- Mode dinàmic --- */
  .dynamic-banner {
    background-color: rgba(217, 119, 87, 0.1);
    border: 1px solid var(--accent);
    padding: 12px;
    border-radius: var(--radius-sm);
    margin: 0 0 4px;
    font-size: 0.82rem;
    line-height: 1.45;
  }

  /* --- Guia del cas (finestra modal) --- */
  .card-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .card-title-row .card-title { margin: 0; }
  .help-btn {
    width: 20px;
    height: 20px;
    padding: 0;
    border-radius: 50%;
    background-color: var(--btn-secondary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .help-btn:hover, .help-btn:focus-visible { color: #fff; background-color: var(--accent); border-color: var(--accent); outline: none; }
  .input-with-button + .field-note, input + .field-note { margin-top: 6px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 860px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 20px 24px 14px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { font-size: 1.15rem; font-weight: 500; margin: 0 0 4px; }
  .modal-head p { margin: 0; font-size: 0.82rem; color: var(--text-secondary); line-height: 1.45; }
  .modal-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    width: 32px;
    height: 32px;
    font-size: 1.1rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .modal-close:hover { color: var(--text-primary); border-color: var(--border-focus); }
  .modal-body { padding: 18px 24px 24px; overflow-y: auto; font-size: 0.86rem; line-height: 1.55; }
  .guide-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .guide-box {
    background-color: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
  }
  .guide-box h3 { font-size: 0.95rem; font-weight: 600; margin: 0 0 2px; }
  .guide-box .guide-tag { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); font-weight: 600; }
  .guide-box .guide-lead { color: var(--text-secondary); margin: 6px 0 8px; font-size: 0.82rem; }
  .guide-box ul, .guide-tips ul { margin: 0; padding-left: 18px; }
  .guide-box li, .guide-tips li { margin-bottom: 4px; }
  .guide-box li.guide-pending { color: var(--text-secondary); opacity: 0.75; }
  .guide-pending-note { margin: 6px 0 0; font-size: 0.75rem; font-style: italic; color: var(--text-secondary); opacity: 0.75; }
  .guide-avoid { margin-top: 10px; font-size: 0.8rem; color: var(--text-secondary); }
  .guide-avoid strong { color: var(--error); font-weight: 600; }
  .guide-tips { margin-top: 16px; }
  .guide-tips h3, .guide-example h3 { font-size: 0.95rem; font-weight: 600; margin: 0 0 8px; }
  .guide-example { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .guide-example .guide-lead { color: var(--text-secondary); margin: 0 0 10px; font-size: 0.82rem; }
  .guide-example-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); font-weight: 600; margin: 10px 0 4px; }
  .guide-example-text {
    background-color: var(--pre-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    white-space: pre-wrap;
    font-size: 0.8rem;
    line-height: 1.5;
  }
  body.modal-open { overflow: hidden; }

  /* --- Visor de prompt --- */
  .prompt-viewer-box {
    display: none;
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .prompt-viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background-color: var(--input-bg);
    border-bottom: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--text-secondary);
  }
  .zoom-controls { display: flex; gap: 6px; }
  .zoom-btn {
    background-color: var(--btn-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 0.75rem;
    cursor: pointer;
    font-weight: bold;
  }
  .prompt-viewer-text {
    background-color: var(--pre-bg);
    color: var(--text-primary);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    padding: 14px;
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 420px;
    overflow-y: auto;
    font-size: 0.82rem;
    line-height: 1.5;
  }

  .hidden { display: none !important; }

  @media (max-width: 720px) {
    .trait-row { grid-template-columns: 1fr; grid-template-areas: "name" "seg" "desc"; }
    .guide-cols { grid-template-columns: 1fr; }
    .modal-head, .modal-body { padding-left: 16px; padding-right: 16px; }
    .seg-btn { white-space: normal; overflow: visible; line-height: 1.2; font-size: 0.74rem; padding: 6px 3px; hyphens: auto; }
    .btn-group-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="ui_title">Generador de Clients</h1>
      <p class="subtitle" id="ui_subtitle"></p>
    </div>
    <div class="header-controls">
      <button class="theme-btn" id="themeToggle" onclick="alternarTema()" title="Mode fosc / clar" aria-label="Mode fosc / clar">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="lang-selector">
        <button class="lang-btn active" onclick="canviarIdiomaUI('cat')" id="btn_lang_cat">CAT</button>
        <button class="lang-btn" onclick="canviarIdiomaUI('es')" id="btn_lang_es">ES</button>
        <button class="lang-btn" onclick="canviarIdiomaUI('en')" id="btn_lang_en">EN</button>
      </div>
    </div>
  </header>

  <div class="top-toolbar">
    <button class="btn btn-secondary" id="ui_btn_import" onclick="document.getElementById('fileInput').click()"></button>
    <input type="file" id="fileInput" accept=".json" class="hidden" onchange="importarJson(event)">
  </div>

  <!-- IDENTIFICACIÓ -->
  <div class="card">
    <div class="card-title" id="ui_sec_id"></div>

    <label class="field" for="assistantName" id="ui_lbl_assistant"></label>
    <input type="text" id="assistantName" value="client_hospital">

    <label class="field" for="companyName" id="ui_lbl_company"></label>
    <input type="text" id="companyName" value="Hospital Comarcal de l'Alt Vallès">

      <label class="field" id="ui_lbl_agent_langs"></label>

**No observable (N/O) i 0.** El 0 vol dir que hi havia oportunitat i no es va aprofitar. El N/O vol dir que no hi ha hagut cap oportunitat raonable d'observar el criteri. {codiH} només pot ser N/O si el projecte no té persones usuàries ni treballadores, i I només si el projecte no consumeix recursos ni afecta ningú. No facis servir el N/O perquè la nota sigui baixa. Normalitza: **puntuació final = 100 × punts obtinguts / màxim dels criteris observables**. Indica quins criteris s'han exclòs i el màxim utilitzat. Si hi ha tan poca evidència que la nota no és representativa, marca l'avaluació com a provisional i explica'n el motiu.

### 9.6 Estructura de l'informe

L'informe es lliura en dues parts: primer el resum, que sempre s'escriu, i després els apartats que triï l'estudiant. Els apartats desenvolupen l'avaluació que ja has fet: han de ser coherents amb els nivells i les puntuacions del resum. No tornis a avaluar ni canviïs cap nota. Escriu el menú en l'idioma de l'avaluació.

#### Resum

**Avaluació de l'Entrevista**

Un criteri per línia, amb el format «Criteri: nivell (n) → X/màxim». {formatH}Indica els N/O i la normalització si escau.

Just abans de la puntuació total, en una línia pròpia i separada per línies en blanc, escriu el càlcul en aquest format, que no es mostra a l'estudiant:

[//]: # (CALCUL: 7,5 + 11,25 + 2,5 + … = SUMA; MAXIM = punts dels criteris observables; FINAL = 100 × SUMA / MAXIM = Z)

Serveix perquè facis la suma pas a pas abans d'escriure el total. Dins dels parèntesis no hi posis cap altre parèntesi. La puntuació total ha de coincidir amb el resultat d'aquest càlcul.

**Puntuació total: XX/100**

**Valoració general** — dues o tres frases: què ha funcionat millor i què és el que més cal millorar. No hi repeteixis les notes.

Acaba el resum amb aquest menú:

Vols aprofundir en algun apartat? Respon amb el número (pots triar-ne més d'un, o «tots»). Si no, respon «cap»; més endavant podràs tornar a aquest menú escrivint «{comanda}».
- **1.** Punts forts
- **2.** Febleses principals
- **3.** Competències transversals
- **4.** El client que t'ha tocat
- **5.** Com tractar aquest tipus de client

Escriu sempre el menú així, com a llista de pics amb el número en negreta, i no com a llista numerada: una llista numerada es renumera sola i l'estudiant veuria números que no corresponen als apartats.

#### Apartats

1. **Punts forts** — fins a tres, cadascun amb una evidència concreta de la conversa i el seu valor per a l'entrevista.

2. **Febleses principals** — fins a tres demostrables, cadascuna amb evidència, conseqüència i una recomanació accionable. No n'inventis per arribar a tres; prioritza les que més afecten la definició de requisits.

3. **Competències transversals** — justificació dels criteris F, H i I, sense nota addicional. Per a cada competència: el nivell, l'evidència principal (una cita breu d'un missatge de l'estudiant) i què li hauria calgut per arribar al nivell següent.
   - Comunicació eficaç (CT3): criteri F.
   - {ctH}
   - Sostenibilitat i compromís social (CT2): criteri I.

4. **El client que t'ha tocat** — nom fictici, càrrec i perfil complet. Un eix per línia, en llenguatge planer: nivell assignat, conducta realment manifestada, si l'estudiant la va gestionar bé i una evidència. Diferencia el tret assignat de la conducta que va arribar a manifestar-se, i no atribueixis a l'estudiant la capacitat de detectar un tret que no es va fer visible.

5. **Com tractar aquest tipus de client** — per a cada eix, una guia pràctica basada en la «guia de maneig» del nivell assignat i en el que va passar: què va funcionar, què es podria fer diferent, i una pregunta, formulació o acció concreta per a una entrevista futura. Per a E6: si era Neutral, indica que no es preveia cap conducta diferenciada; si no era Neutral però no es va manifestar prou, explica que no hi ha evidència suficient per valorar-ne la gestió; si es va manifestar, explica com respondre-hi professionalment, afecti qui afecti.

#### Continuació

Si després dels apartats encara en queden de pendents, acaba amb: «Vols veure un altre apartat? Respon amb el número, o "cap" si no en vols veure més.» i la llista només dels pendents, amb el mateix format i el seu número original. Per exemple, si queden l'1 i el 3:

- **1.** Punts forts
- **3.** Competències transversals`;

<!-- =========================================================================
     LÒGICA DE L'EINA (no cal tocar-la per canviar textos ni prompts)
     ========================================================================= -->
<script>
let currentLang = "cat";
let promptFontSize = 0.82;
const estat = { sel: {} };
let firmaTrets = "";

/* ===== Utilitats ===== */
const $ = id => document.getElementById(id);
const t = () => UI_LANGS[currentLang];
const esDinamic = () => $("dynamicProfile").checked;
const esAvancat = () => $("advancedMode").checked;
const tret = id => ATRIBUTS.find(a => a.id === id);
const opcio = (attrId, optId) => { const a = tret(attrId); return a ? a.opcions.find(o => o.id === optId) : undefined; };

/* Trets que es mostren i s'injecten segons el mode */
function tretsVisibles() {
  return ATRIBUTS.filter(a => a.actiu && (!a.avancat || esAvancat()));
}

/* Substitució en un sol pas (el text de l'usuari no es torna a processar) */
function omplir(plantilla, valors) {
  return plantilla.replace(/\{(\w+)\}/g, (m, k) => (k in valors ? String(valors[k]) : m));
}

/* Atzar criptogràfic quan està disponible */
function rnd(n) {
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] % n;
  }
  return Math.floor(Math.random() * n);
}

const triar = arr => arr[rnd(arr.length)];

function nomAleatori() {
  const genere = rnd(2) ? "f" : "m";
  return { nom: `${triar(NOMS_POOL.prenoms[genere])} ${triar(NOMS_POOL.cognoms)}`, genere };
}

/* Gènere del prenom segons el pool ("f", "m" o null si no és a la llista) */
function generePrenom(nomComplet) {
  const prenom = textNet(nomComplet).split(" ")[0] || "";
  if (NOMS_POOL.prenoms.f.includes(prenom)) return "f";
  if (NOMS_POOL.prenoms.m.includes(prenom)) return "m";
  return null;
}

/* Càrrec en la forma del gènere indicat. Si no se sap, només càrrecs invariables. */
function carrecAleatori(genere, excepte) {
  let pool = genere ? CARRECS.map(c => c[genere]) : CARRECS.filter(c => c.m === c.f).map(c => c.m);
  const alternatives = pool.filter(c => c !== excepte);
  if (alternatives.length) pool = alternatives;
  return triar(pool);
}

function textNet(s) { return (s || "").replace(/\s+/g, " ").trim(); }

/* ===== Selecció i regles ===== */
function selPerDefecte() {
  const s = {};
  ATRIBUTS.forEach(a => { s[a.id] = a.defecte; });
  return s;
}

function normalitzarSel(s) {
  const out = selPerDefecte();
  if (s && typeof s === "object") {
    ATRIBUTS.forEach(a => { if (opcio(a.id, s[a.id])) out[a.id] = s[a.id]; });
  }
  return out;
}

/* Una regla s'aplica només si tots els seus trets són visibles */
function reglesAplicables() {
  const ids = tretsVisibles().map(a => a.id);
  return REGLES.filter(r => Object.keys(r.cond).every(k => ids.includes(k)));
}

function reglaViolada(sel, attrId) {
  return reglesAplicables().find(r =>
    (!attrId || attrId in r.cond) &&
    Object.entries(r.cond).every(([a, v]) => sel[a] === v)
  ) || null;
}

function selAleatoria() {
  for (let i = 0; i < 500; i++) {
    const s = { ...estat.sel };
    tretsVisibles().forEach(a => { s[a.id] = a.opcions[rnd(a.opcions.length)].id; });
    if (!reglaViolada(s)) return s;
  }
  return selPerDefecte();
}


/* ===== Tema ===== */
function alternarTema() {
  const clar = document.body.classList.toggle("light-theme");
  try { localStorage.setItem("theme_preference", clar ? "light" : "dark"); } catch (e) {}
}

function carregarTemaPreferit() {
  let guardat = null;
  try { guardat = localStorage.getItem("theme_preference"); } catch (e) {}
  const clar = guardat === "light";
  document.body.classList.toggle("light-theme", clar);
}

/* ===== Interfície ===== */
function canviarIdiomaUI(lang) {
  currentLang = lang;
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.id === `btn_lang_${lang}`));
  document.documentElement.lang = lang === "cat" ? "ca" : lang;
  aplicarTextosUI();
}

function aplicarTextosUI() {
  const x = t();
  const textos = {
    ui_subtitle: x.subtitle, ui_sec_id: x.secId, ui_lbl_assistant: x.lblAssistant,
    ui_lbl_charname: x.lblCharName, ui_btn_random_name: x.btnRandomName, ui_lbl_charrole: x.lblCharRole, ui_lbl_company: x.lblCompany, ui_note_role: x.noteRole,
    ui_lbl_agent_langs: x.lblAgentLangs, ui_lbl_lang_hint: x.lblLangHint, ui_lbl_force_lang: x.lblForceLang,
    ui_tt_force_lang: x.ttForceLang, ui_sec_traits: x.secTraits, ui_btn_random_traits: x.btnRandomTraits,
    ui_lbl_advanced: x.lblAdvanced, ui_tt_advanced: x.ttAdvanced, ui_lbl_dynamic: x.lblDynamic,
    ui_tt_dynamic: x.ttDynamic, ui_btn_random_role: x.btnRandomRole, ui_btn_random_case: x.btnRandomCase,
    ui_lbl_free: x.lblFree, ui_note_free: x.noteFree, ui_sec_case: x.secCase, ui_lbl_open: x.lblOpen,
    ui_lbl_hidden: x.lblHidden, ui_btn_download: x.btnDownload, ui_btn_import: x.btnImport,
    ui_btn_copy: x.btnCopy, ui_lbl_viewer_title: x.lblViewerTitle, ui_btn_preview: x.btnPreview
  };
  for (const id in textos) $(id).textContent = textos[id];
  $("ui_btn_random_case").title = x.ttRandomCase;
  $("ui_title").innerHTML = `${x.title} <span class="badge">${VERSIO}</span>`;
  $("ui_banner_dynamic").innerHTML = x.bannerDynamic;
  $("caseHelpBtn").title = GUIA_CAS[currentLang].ajuda;
  $("caseHelpBtn").setAttribute("aria-label", GUIA_CAS[currentLang].ajuda);
  if ($("guideOverlay").classList.contains("open")) renderGuiaCas();
  $("ui_btn_view").textContent = $("promptViewerBox").style.display === "block" ? x.btnHideView : x.btnView;
  renderitzar();
}

function plegar(id, plegat) {
  const el = $(id);
  el.classList.toggle("collapsed", plegat);
  el.setAttribute("aria-hidden", plegat ? "true" : "false");
}

function renderitzar() {
  const din = esDinamic();
  const adv = esAvancat();

  plegar("dynamicPanel", !din);
  plegar("identityBlock", din);
  plegar("traitsBlock", din);
  plegar("freeTraitBox", !adv);

  renderTrets();
  renderAvis();
  actualitzarComptador();
  refrescarVistes();
}

function crearFila(at) {
  const row = document.createElement("div");
  row.className = "trait-row";
  row.dataset.attr = at.id;
  const nom = document.createElement("div");
  nom.className = "trait-name";
  nom.textContent = at.nom[currentLang];
  const grid = document.createElement("div");
  grid.className = "seg-grid no-anim";
  grid.style.setProperty("--n", at.opcions.length);
  const indicador = document.createElement("span");
  indicador.className = "seg-indicator";
  indicador.setAttribute("aria-hidden", "true");
  grid.appendChild(indicador);
  row.appendChild(nom);
  row.appendChild(grid);
  return { row, grid };
}

/* Construeix les files només quan canvien els trets visibles o l'idioma.
   Si no, actualitza les existents perquè l'indicador taronja pugui lliscar. */
function renderTrets(forcar) {
  const cont = $("traitsContainer");
  const firma = currentLang + "|" + tretsVisibles().map(a => a.id).join(",");
  if (!forcar && firma === firmaTrets && cont.children.length) { actualitzarTrets(); return; }
  firmaTrets = firma;
  cont.innerHTML = "";

  tretsVisibles().forEach(at => {
    const { row, grid } = crearFila(at);
    grid.setAttribute("role", "group");
    grid.setAttribute("aria-label", at.nom[currentLang]);

    at.opcions.forEach(o => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "seg-btn";
      b.dataset.opt = o.id;
      b.textContent = o.nom[currentLang];
      b.addEventListener("click", () => {
        if (b.getAttribute("aria-disabled") === "true" || estat.sel[at.id] === o.id) return;
        estat.sel[at.id] = o.id;
        actualitzarTrets();
        renderAvis();
        refrescarVistes();
      });
      grid.appendChild(b);
    });

    const desc = document.createElement("div");
    desc.className = "trait-desc";
    row.appendChild(desc);
    cont.appendChild(row);
  });

  actualitzarTrets(true);
  // Primer dibuix sense animació; a partir d'aquí l'indicador llisca
  const reactivar = () => cont.querySelectorAll(".seg-grid.no-anim").forEach(g => g.classList.remove("no-anim"));
  if (window.requestAnimationFrame) requestAnimationFrame(() => requestAnimationFrame(reactivar));
  else reactivar();
}

function actualitzarTrets(inicial) {
  const cont = $("traitsContainer");
  tretsVisibles().forEach(at => {
    const row = cont.querySelector(`[data-attr="${at.id}"]`);
    if (!row) return;
    const idx = Math.max(0, at.opcions.findIndex(o => o.id === estat.sel[at.id]));
    row.querySelector(".seg-grid").style.setProperty("--i", idx);

    row.querySelectorAll(".seg-btn").forEach(b => {
      const o = opcio(at.id, b.dataset.opt);
      const actiu = estat.sel[at.id] === o.id;
      b.setAttribute("aria-pressed", actiu ? "true" : "false");
      const regla = actiu ? null : reglaViolada({ ...estat.sel, [at.id]: o.id }, at.id);
      if (regla) {
        b.setAttribute("aria-disabled", "true");
        b.title = t().ttIncompat + regla.motiu[currentLang];
      } else {
        b.removeAttribute("aria-disabled");
        b.title = o.descripcio[currentLang];
      }
    });

    const desc = row.querySelector(".trait-desc");
    const text = opcio(at.id, estat.sel[at.id])?.descripcio[currentLang] || "";
    if (desc.textContent === text) return;
    if (inicial) { desc.textContent = text; return; }
    desc.classList.add("fade");
    clearTimeout(desc._t);
    desc._t = setTimeout(() => { desc.textContent = text; desc.classList.remove("fade"); }, 140);
  });
}

function renderAvis() {
  const w = $("traitsWarning");
  const r = !esDinamic() ? reglaViolada(estat.sel) : null;
  w.textContent = r ? `${t().warnIncompat} ${r.motiu[currentLang]}` : "";
  w.classList.toggle("active", !!r);
}

function actualitzarComptador() {
  $("freeCount").textContent = `${$("freeTrait").value.length}/${TRET_LLIURE.maxCaracters}`;
}

function actualitzarNotaLlengua() {
  const cap = !$("lang_cat").checked && !$("lang_es").checked && !$("lang_en").checked;
  $("ui_lbl_lang_hint").style.visibility = cap ? "visible" : "hidden";
}

/* Nom aleatori. Si el càrrec actual és de la llista, passa a la forma del nou gènere. */
function generarNomAleatori() {
  const anterior = textNet($("charRole").value);
  const { nom, genere } = nomAleatori();
  $("charName").value = nom;
  const c = CARRECS.find(x => x.m === anterior || x.f === anterior);
  if (c) $("charRole").value = c[genere];
  refrescarVistes();
}

function generarCarrecAleatori() {
  $("charRole").value = carrecAleatori(generePrenom($("charName").value), textNet($("charRole").value));
  refrescarVistes();
}

/* ===== Guia del cas (finestra modal) ===== */
function renderGuiaCas() {
  const g = GUIA_CAS[currentLang];
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const caixa = b => `
    <div class="guide-box">
      <span class="guide-tag">${esc(b.tag)}</span>
      <h3>${esc(b.titol)}</h3>
      <p class="guide-lead">${esc(b.lead)}</p>
      <ul>${b.punts.map(p => `<li>${esc(p)}</li>`).join("")}${(b.puntsPendents || []).map(p => `<li class="guide-pending">${esc(p)}</li>`).join("")}</ul>
      ${b.notaPendent ? `<p class="guide-pending-note">${esc(b.notaPendent)}</p>` : ""}
      <p class="guide-avoid"><strong>✕</strong> ${esc(b.evitar)}</p>
    </div>`;
  $("guideTitle").textContent = g.titol;
  $("guideIntro").textContent = g.intro;
  $("guideClose").setAttribute("aria-label", g.tancar);
  $("guideClose").title = g.tancar;
  $("guideBody").innerHTML = `
    <div class="guide-cols">${caixa(g.oberta)}${caixa(g.oculta)}</div>
    <div class="guide-tips">
      <h3>${esc(g.consellsTitol)}</h3>
      <ul>${g.consells.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    </div>
`;
}

function obrirGuiaCas() {
  renderGuiaCas();
  $("guideOverlay").classList.add("open");
  document.body.classList.add("modal-open");
  $("guideBody").scrollTop = 0;
  $("guideClose").focus();
}

function tancarGuiaCas() {
  if (!$("guideOverlay").classList.contains("open")) return;
  $("guideOverlay").classList.remove("open");
  document.body.classList.remove("modal-open");
  $("caseHelpBtn").focus();
}

/* Omple el cas amb un exemple diferent de l'actual. Si el cas s'ha editat a mà, demana confirmació. */
let casActual = 0;
function casAleatori() {
  const oberta = $("infoOberta").value.trim();
  const oculta = $("infoOculta").value.trim();
  const esExemple = CASOS_EXEMPLE.some(c => c.infoOberta === oberta && c.infoOculta === oculta);
  if ((oberta || oculta) && !esExemple && !confirm(t().confirmRandomCase)) return;
  let i;
  do { i = rnd(CASOS_EXEMPLE.length); } while (i === casActual && CASOS_EXEMPLE.length > 1);
  casActual = i;
  const c = CASOS_EXEMPLE[i];
  $("assistantName").value = c.nomIntern;
  $("companyName").value = c.empresa;
  $("infoOberta").value = c.infoOberta;
  $("infoOculta").value = c.infoOculta;
  refrescarVistes();
}

function randomitzarTrets() {
  if (esDinamic()) return;
  estat.sel = selAleatoria();
  renderitzar();
}

/* Si en canviar de mode la selecció actual queda incompatible, se'n tria una de vàlida */
function canviMode() {
  if (reglaViolada(estat.sel)) estat.sel = selAleatoria();
  renderitzar();
}

function refrescarVistes() {
  if ($("promptViewerBox").style.display === "block") $("promptViewerText").textContent = compilarSystemPrompt();
  if ($("previewJson").style.display === "block") $("previewJson").textContent = JSON.stringify(generarEstructuraJSON(), null, 2);
}

function canviarZoomPrompt(delta) {
  promptFontSize = Math.min(Math.max(promptFontSize + delta, 0.65), 1.35);
  $("promptViewerText").style.fontSize = `${promptFontSize}rem`;
}

function alternarVisorPrompt() {
  const box = $("promptViewerBox");
  const obrir = box.style.display !== "block";
  box.style.display = obrir ? "block" : "none";
  $("ui_btn_view").textContent = obrir ? t().btnHideView : t().btnView;
  if (obrir) {
    $("promptViewerText").textContent = compilarSystemPrompt();
    $("promptViewerText").style.fontSize = `${promptFontSize}rem`;
  }
}

function alternarPrevisualitzacio() {
  const pre = $("previewJson");
  const obrir = pre.style.display !== "block";
  pre.style.display = obrir ? "block" : "none";
  if (obrir) pre.textContent = JSON.stringify(generarEstructuraJSON(), null, 2);
}

/* ===== Compilació del prompt ===== */
function idiomesSeleccionats() {
  const s = [];
  if ($("lang_cat").checked) s.push({ id: "cat", nom: "català" });
  if ($("lang_es").checked) s.push({ id: "es", nom: "castellà" });
  if ($("lang_en").checked) s.push({ id: "en", nom: "anglès" });
  return s;
}

/* "català", "català o castellà", "català, castellà o anglès" */
/* "català", "català i castellà", "català, castellà i anglès" */
function llista(noms, conj) {
  return noms.length < 2 ? noms.join("") : `${noms.slice(0, -1).join(", ")} ${conj} ${noms.at(-1)}`;
}

const NOMBRES = ["zero", "un", "dos", "tres", "quatre", "cinc", "sis", "set"];

function compilarIdioma() {
  const sel = idiomesSeleccionats();
  if (sel.length === 0) sel.push({ id: "cat", nom: "català" });
  const inici = sel[0].nom;
  if (!$("forceLanguages").checked) return omplir(P_IDIOMA_LLIURE, { inici });
  if (sel.length === 1) return omplir(P_IDIOMA_FORCAT_UN, { inici });
  return omplir(P_IDIOMA_FORCAT_DIVERSOS, { inici, permesos: llista(sel.map(l => l.nom), "i") });
}

function nomOrganitzacio() {
  const e = textNet($("companyName").value);
  return e ? `«${e}»` : "l'organització que encarrega el projecte";
}

function compilarIdentitat() {
  const nom = textNet($("charName").value);
  const carrec = textNet($("charRole").value);
  if (esDinamic() || (!nom && !carrec)) {
    return omplir(P_IDENTITAT_DINAMICA, { organitzacio: nomOrganitzacio(), abast: P_ABAST });
  }
  return omplir(P_IDENTITAT_FIXA, {
    organitzacio: nomOrganitzacio(),
    nom: nom || "tria'l tu, de manera coherent amb el càrrec",
    carrec: carrec || "tria'l tu, de manera coherent amb el cas",
    abast: P_ABAST
  });
}

function tretLliureActiu() {
  return esAvancat() ? textNet($("freeTrait").value).slice(0, TRET_LLIURE.maxCaracters) : "";
}

function ambE6() {
  return tretsVisibles().some(a => a.eix === "E6");
}

function e6ambBiaix() {
  const a = tretsVisibles().find(x => x.eix === "E6");
  if (!a) return false;
  if (esDinamic()) return true;
  return a.opcions.findIndex(o => o.id === estat.sel[a.id]) > 0;
}

function compilarPerfil() {
  const eixos = tretsVisibles();
  const din = esDinamic();
  const parts = [];

  parts.push(omplir(din ? P_PERFIL_INTRO_DINAMIC : P_PERFIL_INTRO_FIX, {
    nEixos: NOMBRES[eixos.length] || eixos.length,
    rangEixos: `${eixos[0].eix} a ${eixos.at(-1).eix}`
  }));

  let num = 1;
  if (din) {
    parts.push(omplir(P_OBTENCIO, {
      format: eixos.map(a => a.eix).join("-"),
      rangs: llista(eixos.map(a => `${a.eix} 1–${a.opcions.length}`), "i"),
      variabilitat: ambE6() ? P_VARIABILITAT_AMB_E6 : P_VARIABILITAT_SENSE_E6
    }));
    num = 2;
  }

  parts.push(omplir(P_APLICACIO, {
    num: `7.${num}`,
    funcions: eixos.map(a => `${a.eix} ${FUNCIO_EIX[a.eix]}`).join("; ")
  }));

  eixos.forEach(a => {
    let bloc = `#### ${a.eix} — ${a.capcalera}\n\n`;
    let nivell = 0;
    if (din) {
      bloc += a.opcions.map((o, k) => `${k + 1}. **${o.etiqueta}.** ${o.prompt} *(Guia: ${o.guia})*`).join("\n");
    } else {
      nivell = Math.max(0, a.opcions.findIndex(o => o.id === estat.sel[a.id]));
      const o = a.opcions[nivell];
      bloc += `Nivell assignat: **${nivell + 1}. ${o.etiqueta}.** ${o.prompt} *(Guia: ${o.guia})*`;
    }
    if (a.eix === "E6" && (din || nivell > 0)) bloc += "\n\n" + P_NORMES_E6;
    parts.push(bloc);
  });

  const lliure = tretLliureActiu();
  if (lliure) parts.push(omplir(P_TRET_LLIURE, { text: lliure }));

  parts.push(P_NORMES_PERFIL);
  parts.push(omplir(P_COMPROVACIO, { num: `7.${num + 1}` }));
  return parts.join("\n\n");
}

function compilarSystemPrompt() {
  const din = esDinamic();
  return [
    P_FUNCIO,
    compilarIdioma(),
    compilarIdentitat(),
    omplir(P_CAS, { infoOberta: $("infoOberta").value.trim(), infoOculta: $("infoOculta").value.trim() }),
    P_INFORMACIO,
    P_REQUISITS,
    compilarPerfil(),
    omplir(P_CONDUCCIO, { liniaPerfil: din ? "línia de perfil, " : "" }),
    omplir(P_AVALUACIO, {
      comanda: COMANDA_AVALUACIO,
      liniaPerfilAval: din ? "no escrius la línia de perfil, " : "",
      notaE6: ambE6() ? "" : P_NOTA_SENSE_E6,
      ...VARIANT_H[e6ambBiaix() ? "complet" : "simple"]
    })
  ].join("\n\n---\n\n");
}

/* ===== Exportació ===== */
function generarEstructuraJSON() {
  const nomAssistent = textNet($("assistantName").value) || "client";
  const nom = textNet($("charName").value);
  const empresa = textNet($("companyName").value);
  const din = esDinamic();

  const callbackConfig = JSON.stringify({
    prompt_processor: "simple_augment",
    connector: "openai",
    llm: MODEL_LLM,
    rag_processor: "no_rag",
    file_path: "",
    capabilities: { vision: true, image_generation: false }
  });

  return {
    name: nomAssistent,
    description: din
      ? `Client simulat (identitat i perfil dinàmics)${empresa ? ` · ${empresa}` : ""}`
      : `Client simulat: ${nom}${empresa ? ` (${empresa})` : ""}`,
    api_callback: callbackConfig,
    system_prompt: compilarSystemPrompt(),
    prompt_template: PLANTILLA_MISSATGE,
    RAG_endpoint: "",
    RAG_Top_k: 3,
    RAG_collections: "",
    pre_retrieval_endpoint: "",
    post_retrieval_endpoint: "",
    published: false,
    metadata: callbackConfig,
    _config: {
      versio: VERSIO,
      assistantName: nomAssistent,
      charName: nom,
      charRole: textNet($("charRole").value),
      empresa,
      agentLangs: idiomesSeleccionats().map(l => l.id),
      forceLanguages: $("forceLanguages").checked,
      advancedMode: esAvancat(),
      dynamicProfile: din,
      trets: { ...estat.sel },
      tretLliure: textNet($("freeTrait").value),
      infoOberta: $("infoOberta").value,
      infoOculta: $("infoOculta").value
    }
  };
}

function descarregarJson() {
  const dades = generarEstructuraJSON();
  const blob = new Blob([JSON.stringify(dades, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `${dades.name}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

function feedbackBoto(btn, text, ok, original) {
  btn.textContent = text;
  btn.style.borderColor = ok ? "var(--success)" : "var(--error)";
  btn.style.color = ok ? "var(--success)" : "var(--error)";
  setTimeout(() => {
    btn.textContent = original();
    btn.style.borderColor = "";
    btn.style.color = "";
  }, 2200);
}

function copiarPrompt() {
  const text = compilarSystemPrompt();
  const btn = $("ui_btn_copy");
  const exit = () => feedbackBoto(btn, t().copied, true, () => t().btnCopy);
  const error = () => feedbackBoto(btn, t().copyError, false, () => t().btnCopy);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(exit).catch(() => copiaAlternativa(text, exit, error));
  } else {
    copiaAlternativa(text, exit, error);
  }
}

function copiaAlternativa(text, exit, error) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-999999px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    ok ? exit() : error();
  } catch (e) {
    error();
  }
}

/* ===== Importació ===== */
function aplicarIdiomes(llista) {
  $("lang_cat").checked = llista.includes("cat");
  $("lang_es").checked = llista.includes("es");
  $("lang_en").checked = llista.includes("en");
  actualitzarNotaLlengua();
}

/* Busca a quin tret i opció correspon un text de prompt */
function trobarOpcioPerText(text) {
  for (const a of ATRIBUTS) {
    const o = a.opcions.find(op => text.includes(op.prompt));
    if (o) return { attrId: a.id, optId: o.id };
  }
  return null;
}

function seccio(sp, capcalera) {
  const i = sp.indexOf(capcalera);
  if (i === -1) return null;
  const inici = i + capcalera.length;
  const fi = sp.indexOf("\n=== ", inici);
  return sp.slice(inici, fi === -1 ? sp.length : fi).trim();
}

function importarDesDeConfig(c) {
  if (c.assistantName) $("assistantName").value = c.assistantName;
  if (c.charName) $("charName").value = c.charName;
  if (c.charRole) $("charRole").value = c.charRole;
  $("companyName").value = typeof c.empresa === "string" ? c.empresa : "";
  if (Array.isArray(c.agentLangs)) aplicarIdiomes(c.agentLangs);
  else if (c.agentLang) aplicarIdiomes([c.agentLang]);
  if (c.forceLanguages !== undefined) $("forceLanguages").checked = !!c.forceLanguages;
  if (c.infoOberta !== undefined) $("infoOberta").value = c.infoOberta;
  if (c.infoOculta !== undefined) $("infoOculta").value = c.infoOculta;

  // Trets de versions anteriors amb ids diferents s'ignoren (queden els valors per defecte)
  estat.sel = normalitzarSel(c.trets);
  $("freeTrait").value = typeof c.tretLliure === "string" ? c.tretLliure.slice(0, TRET_LLIURE.maxCaracters) : "";
  $("advancedMode").checked = !!c.advancedMode || !!(c.tretLliure && c.tretLliure.trim());
  $("dynamicProfile").checked = !!c.dynamicProfile;
}

/* Prompt v0.4+ (estructura del prompt de referència, seccions «## 1.» a «## 9.») */
function importarDesDePromptV4(sp) {
  const mOrg = sp.match(/Ets un representant fictici de «(.+?)»\./);
  $("companyName").value = mOrg ? mOrg[1].trim() : "";

  const dinamic = sp.includes("### 7.1 Obtenció i persistència");
  $("dynamicProfile").checked = dinamic;

  const mId = sp.match(/^- Nom: (.+)\n- Càrrec: (.+)$/m);
  if (mId) {
    $("charName").value = mId[1].trim();
    $("charRole").value = mId[2].trim();
  }

  const oberta = sp.match(/<informacio_oberta>\n?([\s\S]*?)\n?<\/informacio_oberta>/);
  if (oberta) $("infoOberta").value = oberta[1].trim();
  const restringida = sp.match(/<informacio_restringida>\n?([\s\S]*?)\n?<\/informacio_restringida>/);
  if (restringida) $("infoOculta").value = restringida[1].trim();

  const noms = { "català": "cat", "castellà": "es", "anglès": "en" };
  const mInici = sp.match(/^- Idioma inicial: (.+)$/m);
  const mPermesos = sp.match(/^- Idiomes permesos: (.+)$/m);
  $("forceLanguages").checked = !!mPermesos;
  const font = (mPermesos ? mPermesos[1] : (mInici ? mInici[1] : "català")).toLowerCase();
  aplicarIdiomes(Object.keys(noms).filter(n => font.includes(n)).map(n => noms[n]));

  estat.sel = selPerDefecte();
  if (!dinamic) {
    [...sp.matchAll(/^#### (E\d) — [^\n]*\n\nNivell assignat: \*\*(\d+)\./gm)].forEach(m => {
      const a = ATRIBUTS.find(x => x.eix === m[1]);
      const o = a && a.opcions[Number(m[2]) - 1];
      if (o) estat.sel[a.id] = o.id;
    });
  }

  const mLliure = sp.match(/^\*\*Tret addicional\*\* \(sempre actiu, sigui quin sigui el perfil\): (.+)$/m);
  $("freeTrait").value = mLliure ? mLliure[1].trim() : "";
  $("advancedMode").checked = /^#### E6 — /m.test(sp) || !!mLliure;
}

function importarDesDePrompt(data) {
  if (data.name) $("assistantName").value = data.name;
  const sp = data.system_prompt || "";
  if (sp.includes("## 1. FUNCIÓ I OBJECTIU PEDAGÒGIC")) { importarDesDePromptV4(sp); return; }

  const mRol31 = sp.match(/^Ets (.+?)\. El teu càrrec és (.+?) a (?:l'organització «(.+?)»|l'empresa)\./m);
  const mRol30 = sp.match(/^Ets\s+([^,\n]+),\s+(.+?)\s+de l'empresa\./m);
  $("companyName").value = "";
  if (mRol31) {
    $("charName").value = mRol31[1].trim();
    $("charRole").value = mRol31[2].trim();
    if (mRol31[3]) $("companyName").value = mRol31[3].trim();
  } else if (mRol30) {
    $("charName").value = mRol30[1].trim();
    $("charRole").value = mRol30[2].trim();
  } else if (data.description) {
    const m = data.description.match(/(?:Client|Stakeholder) simulat:\s*([^(·]+)/i);
    if (m) $("charName").value = m[1].trim();
  }

  const context = seccio(sp, "=== EL CAS ===")?.replace(/^Això ho saps i ho pots explicar[^\n]*\n/, "") ?? seccio(sp, "=== CONTEXT DE L'EMPRESA ===") ?? (sp.match(/CONTEXT GENERAL DE L'EMPRESA:\s*\n([\s\S]*?)\n\s*(?:PERFIL|INFORMACIÓ RESERVADA)/) || [])[1];
  if (context) $("infoOberta").value = context.trim();

  let reservada = seccio(sp, "=== INFORMACIÓ RESERVADA ===");
  if (reservada) reservada = reservada.replace(/^(?:Aquesta informació només la reveles|Això també ho saps)[^\n]*\n/, "");
  else reservada = (sp.match(/INFORMACIÓ RESERVADA I CUSTODIADA:\s*\n([\s\S]*?)\n\s*DIRECTRIUS DE COMPORTAMENT/) || [])[1];
  if (reservada) $("infoOculta").value = reservada.trim();

  const idioma = (seccio(sp, "=== IDIOMA ===") || sp).toLowerCase();
  $("forceLanguages").checked = idioma.includes("només parles") || idioma.includes("gestió estricta") || idioma.includes("gestió lingüística estricta");
  aplicarIdiomes(["cat", "es", "en"].filter((id, i) => idioma.includes(["català", "castellà", "anglès"][i])));

  estat.sel = selPerDefecte();
  let avancat = false;
  let lliure = "";

  const dinamic = sp.includes("=== EL TEU PERFIL (ES DEFINEIX AL PRIMER MISSATGE) ===");
  $("dynamicProfile").checked = dinamic;

  if (dinamic) {
    const blocs = sp.split(/^EIX \d+ — .+$/m).slice(1);
    // Només cal saber quins trets hi surten (per detectar el mode avançat); la numeració és fixa
    blocs.forEach(bloc => {
      const m = bloc.match(/^\d+ = (.+)$/m);
      const r = m && trobarOpcioPerText(m[1]);
      if (r && tret(r.attrId).avancat) avancat = true;
    });
    const mLliure = sp.match(/TRET ADDICIONAL \(sempre actiu[^\n]*\n(.+)/);
    if (mLliure) lliure = mLliure[1].trim();
  } else {
    const perfil = seccio(sp, "=== EL TEU PERFIL ===") || "";
    [...perfil.matchAll(/^- (.+?): (.+)$/gm)].forEach(m => {
      if (m[1] === "Tret addicional") { lliure = m[2].trim(); return; }
      const r = trobarOpcioPerText(m[2]);
      if (r) {
        estat.sel[r.attrId] = r.optId;
        if (tret(r.attrId).avancat) avancat = true;
      }
    });
  }

  $("freeTrait").value = lliure;
  $("advancedMode").checked = avancat || !!lliure;
}

function importarJson(event) {
  const file = event.target.files[0];
  if (!file) return;
  const btn = $("ui_btn_import");
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || (!data._config && !data.system_prompt)) throw new Error("Estructura no reconeguda");
      if (data._config) importarDesDeConfig(data._config);
      else importarDesDePrompt(data);
      renderitzar();
      feedbackBoto(btn, t().imported, true, () => t().btnImport);
    } catch (err) {
      console.error("Error en importar JSON:", err);
      feedbackBoto(btn, t().importError, false, () => t().btnImport);
    } finally {
      event.target.value = "";
    }
  };
  reader.readAsText(file);
}

/* ===== Inici ===== */
function inicialitzarUI() {
  estat.sel = selPerDefecte();
  carregarTemaPreferit();
  $("infoOberta").value = CAS_PER_DEFECTE.infoOberta;
  $("infoOculta").value = CAS_PER_DEFECTE.infoOculta;
  $("freeTrait").maxLength = TRET_LLIURE.maxCaracters;

  ["assistantName", "companyName", "charName", "charRole", "infoOberta", "infoOculta"].forEach(id => $(id).addEventListener("input", refrescarVistes));
  $("freeTrait").addEventListener("input", () => { actualitzarComptador(); refrescarVistes(); });
  ["lang_cat", "lang_es", "lang_en", "forceLanguages"].forEach(id => $(id).addEventListener("change", () => { actualitzarNotaLlengua(); refrescarVistes(); }));
  ["advancedMode", "dynamicProfile"].forEach(id => $(id).addEventListener("change", canviMode));
  document.addEventListener("keydown", e => { if (e.key === "Escape") tancarGuiaCas(); });

  aplicarTextosUI();
  actualitzarNotaLlengua();
}

window.addEventListener("DOMContentLoaded", inicialitzarUI);
